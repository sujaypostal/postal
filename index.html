<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b2a55"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Postal Agent</title>
<script>
/* GitHub Pages version: talks to the Apps Script web app with fetch, keeps working offline.
   Data entered offline waits on this phone and goes to the Sheet by itself when the net is back. */
(function(){
var LS=window.localStorage;
function lget(k,d){try{var v=LS.getItem(k);return v==null?d:v;}catch(e){return d;}}
function lset(k,v){try{if(v==null)LS.removeItem(k);else LS.setItem(k,v);}catch(e){}}
function qs(){var o={};location.search.replace(/^\?/,'').split('&').forEach(function(kv){if(!kv)return;var i=kv.indexOf('=');
  try{o[decodeURIComponent(i<0?kv:kv.slice(0,i))]=decodeURIComponent((i<0?'':kv.slice(i+1)).replace(/\+/g,' '));}catch(e){}});return o;}
var P=qs();
var STANDALONE=false;try{STANDALONE=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){}
if(P.a)lset('pam_api',P.a);
/* sub-agent link: remember it, so the home-screen icon opens his page again */
if(P.s)lset('pam_s',P.s);else if(!STANDALONE)lset('pam_s',null);
if(!P.s&&STANDALONE&&lget('pam_s',''))P.s=lget('pam_s','');
function apiId(){return lget('pam_api','');}
function apiUrl(){var id=apiId();return id?'https:'+'\/\/script.google.com/macros/s/'+id+'/exec':'';}

/* ---------- small store (IndexedDB) for the last data seen ---------- */
var dbp=null;
function db(){if(!dbp)dbp=new Promise(function(res,rej){var r=indexedDB.open('pam',1);r.onupgradeneeded=function(){r.result.createObjectStore('c');};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return dbp;}
function cget(k){return db().then(function(d){return new Promise(function(res){var t=d.transaction('c').objectStore('c').get(k);
  t.onsuccess=function(){res(t.result);};t.onerror=function(){res(undefined);};});}).catch(function(){return undefined;});}
function cput(k,v){return db().then(function(d){return new Promise(function(res){var tx=d.transaction('c','readwrite');tx.objectStore('c').put(v,k);
  tx.oncomplete=res;tx.onerror=res;tx.onabort=res;});}).catch(function(){});}

/* ---------- waiting list (entries made offline) ---------- */
function getQ(){try{return JSON.parse(lget('pam_q','[]'))||[];}catch(e){return [];}}
function setQ(q){lset('pam_q',JSON.stringify(q));banner();}
function addQ(fn,args){var q=getQ();var it={id:Date.now()+''+Math.floor(Math.random()*1000),fn:fn,args:args};q.push(it);setQ(q);return it;}
function delQ(id){setQ(getQ().filter(function(x){return x.id!==id;}));}

var READS=['bootstrap','getCollections','unlotted','lotDetail','commission','subSummary'];
function ckey(fn,a){
  if(fn==='api')return READS.indexOf(a[1])>=0?'api:'+a[1]+':'+JSON.stringify(a[2]||{}):'';
  if(fn==='subBoot')return 'subBoot:'+a[0]+':'+(a[1]||'');
  if(fn==='subComm'||fn==='subBook')return fn+':'+a[0]+':'+JSON.stringify(a[1]||{});
  if(fn==='publicInfo')return 'publicInfo';
  return '';
}
function queueable(fn,a){
  if(fn==='api')return a[1]==='saveCollection';
  return ['subMark','subMarkMany','subPay','subSetPhone','subUnmark'].indexOf(fn)>=0;
}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function modeKey(m){m=String(m||'').toLowerCase();if(m.indexOf('credit')>=0||m==='dhar')return 'Credit';
  if(m.indexOf('online')>=0||m.indexOf('upi')>=0||m.indexOf('cheque')>=0)return 'Online';return 'Cash';}

/* put the waiting entries on top of the last data from the server */
function patchBoot(d){
  if(!d||!d.accounts)return d;
  var t=today();
  getQ().forEach(function(it){
    if(it.fn!=='api'||it.args[1]!=='saveCollection')return;
    var p=it.args[2]||{},a=null;for(var i=0;i<d.accounts.length;i++)if(d.accounts[i].AccNo===p.AccNo){a=d.accounts[i];break;}
    if(!a)return;
    var n=parseInt(p.Months,10)||0,amt=(+a.Amount||0)*n,tot=amt+(+p.DefaultFee||0)-(+p.Rebate||0),dt=p.Date||t;
    a.Paid=(+a.Paid||0)+n;if(!a.LastPay||dt>a.LastPay)a.LastPay=dt;
    var rec={AccNo:a.AccNo,Date:dt,Months:String(n),Total:String(tot),SubAgent:a.SubAgent||''};
    if(d.cur&&dt.slice(0,7)===t.slice(0,7))d.cur.push(rec);
    if(d.unl)d.unl.push(Object.assign({},rec,{ColID:'OFF'+it.id,Amount:String(amt),Mode:modeKey(p.Mode)}));
    if(d.stats){if(dt===t)d.stats.todayAmt=(+d.stats.todayAmt||0)+tot;if(dt.slice(0,7)===t.slice(0,7))d.stats.monthAmt=(+d.stats.monthAmt||0)+tot;
      d.stats.unlottedCnt=(+d.stats.unlottedCnt||0)+1;d.stats.unlottedAmt=(+d.stats.unlottedAmt||0)+tot;}
  });
  return d;
}
function patchSub(d,key){
  if(!d||!d.accounts)return d;
  var find=function(acc){for(var i=0;i<d.accounts.length;i++)if(d.accounts[i].acc===acc)return d.accounts[i];return null;};
  getQ().forEach(function(it){
    if(it.args[0]!==key)return;var p=it.args[1]||{};
    if((it.fn==='subMark'||it.fn==='subMarkMany')&&p.month===d.month){
      var items=it.fn==='subMark'?[{acc:p.acc,n:p.n,mode:p.mode}]:(p.items||[]);
      items.forEach(function(o,j){var x=find(o.acc);if(!x)return;var n=+o.n||0;
        x.entries.push({id:'tmp'+it.id+'_'+j,n:n,total:x.amt*n,mode:o.mode||'Cash',lot:'',mine:true,tmp:true});x.paid+=n;x.due=Math.max(0,x.due-n);});
    }else if(it.fn==='subPay'&&p.month===d.month){
      var tot=0;d.accounts.forEach(function(x){x.entries.forEach(function(e){if(e.mine)tot+=e.total;});});
      var on=+p.online||0,cr=+p.credit||0;d.pay={Total:tot,Online:on,Credit:cr,Cash:tot-on-cr,Note:p.note||'',Updated:'অফলাইনে — নেট এলে যাবে',LedgerTx:''};
    }else if(it.fn==='subSetPhone'){var x=find(p.acc);if(x)x.phone=p.phone;}
    else if(it.fn==='subUnmark'&&p.month===d.month){d.accounts.forEach(function(x){var e=null;x.entries.forEach(function(z){if(z.id===p.id)e=z;});
      if(e){x.entries=x.entries.filter(function(z){return z.id!==p.id;});x.paid-=e.n;x.due+=e.n;}});}
  });
  return d;
}
function patch(fn,a,r){
  if(fn==='api'&&a[1]==='bootstrap')return patchBoot(r);
  if(fn==='subBoot')return patchSub(r,a[0]);
  return r;
}
/* keep a copy of whatever fresh data the server sends back */
function keep(fn,a,r){
  var k=ckey(fn,a);if(k)cput(k,r);
  if(fn==='api'&&r){var b=r.accounts&&r.settings?r:(r.boot&&r.boot.accounts?r.boot:null);if(b)cput('api:bootstrap:{}',b);}
  if(fn.indexOf('sub')===0&&r&&r.sub&&r.accounts){cput('subBoot:'+a[0]+':'+r.month,r);if(fn==='subBoot'&&!a[1])cput('subBoot:'+a[0]+':',r);}
}

/* ---------- network ---------- */
function netErr(){var e=new Error('📴 নেট নেই');e.net=true;return e;}
function post(fn,args){
  var u=apiUrl();if(!u)return Promise.reject(new Error('অ্যাপের সংযোগ বসানো নেই'));
  if(navigator.onLine===false)return Promise.reject(netErr());
  return fetch(u,{method:'POST',body:JSON.stringify({fn:fn,args:args}),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow'})
    .catch(function(){throw netErr();})
    .then(function(res){return res.text();})
    .then(function(tx){var j;try{j=JSON.parse(tx);}catch(e){throw new Error('Apps Script থেকে ঠিক উত্তর আসছে না — Deploy-এ "Who has access: Anyone" আছে কিনা দেখুন');}
      if(!j.ok)throw new Error(j.e||'Error');ONLINE(true);return j.r;});
}
var MEMPW=null,NEEDLOGIN=false;
function hash(s){try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode('pam|'+s)).then(function(b){
  return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}catch(e){return Promise.resolve('');}}
function getTok(){try{if(typeof TOK!=='undefined'&&TOK)return TOK;}catch(e){}return lget('tok','');}
function setTok(t){lset('tok',t);try{TOK=t;}catch(e){}}
function relogin(){if(!MEMPW)return Promise.reject(new Error('SESSION_EXPIRED'));
  return post('login',[MEMPW]).then(function(t){setTok(t);NEEDLOGIN=false;return t;});}

function loginFn(pw){
  return post('login',[pw]).then(function(t){MEMPW=null;NEEDLOGIN=false;hash(pw).then(function(h){if(h)lset('pam_pwh',h);});setTimeout(sync,2000);return t;},
    function(e){
      if(!e.net)throw e;
      return Promise.all([hash(pw),cget('api:bootstrap:{}')]).then(function(x){
        if(!x[1])throw new Error('📴 নেট নেই — এই ফোনে আগে একবার নেট থাকতে লগইন করুন, তারপর অফলাইনেও খুলবে');
        if(!x[0]||x[0]!==lget('pam_pwh',''))throw new Error('Wrong password');
        MEMPW=pw;return 'OFFLINE';});
    });
}
function offline(fn,a,k,wr){
  if(wr){
    var it;
    if(fn==='subUnmark'&&String((a[1]||{}).id||'').indexOf('tmp')===0){
      /* a tick made offline and undone offline: just drop it from the waiting list */
      var q=getQ(),acc=null;
      return cget('subBoot:'+a[0]+':'+(a[1]||{}).month).then(function(){
        for(var i=q.length-1;i>=0;i--){var x=q[i];if(x.args[0]!==a[0])continue;
          if(x.fn==='subMark'){q.splice(i,1);break;}
          if(x.fn==='subMarkMany'&&x.args[1].items&&x.args[1].items.length){x.args[1].items.pop();if(!x.args[1].items.length)q.splice(i,1);break;}}
        setQ(q);return {__offline:1};});
    }
    it=addQ(fn,a);
    if(fn==='api'&&a[1]==='saveCollection'){
      return cget('api:bootstrap:{}').then(function(b){
        if(!b){delQ(it.id);throw new Error('📴 নেট নেই — আগে একবার নেট থাকতে অ্যাপ খুলুন');}
        b=patchBoot(b);b.__cached=1;var p=a[2]||{},ac=null,cu={};
        b.accounts.forEach(function(x){if(x.AccNo===p.AccNo)ac=x;});(b.customers||[]).forEach(function(c){if(ac&&c.CustID===ac.CustID)cu=c;});
        var n=parseInt(p.Months,10)||0,amt=(+(ac||{}).Amount||0)*n,fee=+p.DefaultFee||0,reb=+p.Rebate||0;
        var col={ColID:'OFF'+it.id,Date:p.Date||today(),AccNo:p.AccNo,CustID:ac?ac.CustID:'',Name:cu.Name||'',Scheme:'RD',Months:n,
          FromInst:ac?ac.Paid-n+1:'',ToInst:ac?ac.Paid:'',Amount:amt,DefaultFee:fee,Rebate:reb,Total:amt+fee-reb,LotNo:'',Mode:p.Mode||'Cash',Remarks:p.Remarks||'',SubAgent:ac?ac.SubAgent||'':''};
        tip('📴 অফলাইনে রাখা হলো — নেট এলে Sheet-এ উঠবে');
        return {col:col,boot:b};});
    }
    tip('📴 অফলাইনে রাখা হলো — নেট এলে এজেন্টের কাছে যাবে');
    return Promise.resolve({__offline:1});
  }
  if(k)return cget(k).then(function(r){
    if(r===undefined)throw new Error('📴 নেট নেই — নেট এলে আবার চেষ্টা করুন');
    r=patch(fn,a,r);if(r&&typeof r==='object')r.__cached=1;return r;});
  return Promise.reject(new Error('📴 নেট নেই — এই কাজটা নেট এলে করুন'));
}
function send(fn,a){
  if(!apiId()){setupBox();return Promise.reject(new Error('অ্যাপের সংযোগ বসানো নেই'));}
  if(fn==='login')return loginFn(a[0]);
  var k=ckey(fn,a),wr=queueable(fn,a);
  /* entries wait in order: while older ones are waiting, new ones join the line */
  if(wr&&getQ().length){var r0=offline(fn,a,k,wr);setTimeout(sync,300);return r0;}
  var go=function(){return post(fn,a);};
  if(fn==='api'&&a[0]==='OFFLINE'&&navigator.onLine!==false)go=function(){return relogin().then(function(t){a=a.slice();a[0]=t;return post(fn,a);});};
  return go().then(function(r){keep(fn,a,r);return patch(fn,a,r);},function(e){
    if(e.net){ONLINE(false);return offline(fn,a,k,wr);}
    if(fn==='api'&&String(e.message).indexOf('SESSION_EXPIRED')>=0&&MEMPW)
      return relogin().then(function(t){a=a.slice();a[0]=t;return post(fn,a).then(function(r){keep(fn,a,r);return patch(fn,a,r);});});
    throw e;});
}

/* ---------- send the waiting entries ---------- */
var SYNCING=false,SENT=0;
function sync(){
  if(SYNCING||navigator.onLine===false||!getQ().length){banner();return;}
  SYNCING=true;banner();
  var run=function(){return new Promise(function(fin){
    var stop=function(){SYNCING=false;banner();fin();};
    (function next(){
      var q=getQ();
      if(!q.length){stop();done();return;}
      var it=q[0],a=it.args.slice();
      var step=Promise.resolve();
      if(it.fn==='api'){var t=getTok();
        if(!t||t==='OFFLINE')step=MEMPW?relogin():Promise.reject(new Error('SESSION_EXPIRED'));
        step=step.then(function(){a[0]=getTok();});}
      step.then(function(){return post(it.fn,a);}).then(function(r){keep(it.fn,a,r);delQ(it.id);SENT++;next();},function(e){
        if(e.net){ONLINE(false);stop();return;}
        if(String(e.message).indexOf('SESSION_EXPIRED')>=0){NEEDLOGIN=true;stop();return;}
        delQ(it.id);tip('⚠ অফলাইনের একটা এন্ট্রি ওঠেনি ('+(it.args[2]&&it.args[2].AccNo||it.args[1]&&it.args[1].acc||'')+'): '+e.message,8000);next();});
    })();});};
  /* only one open tab sends at a time */
  if(navigator.locks&&navigator.locks.request)navigator.locks.request('pam_sync',{ifAvailable:true},function(l){if(!l){SYNCING=false;banner();return;}return run();});
  else run();
}
/* another tab sent the waiting entries: show the fresh data here too */
window.addEventListener('storage',function(e){if(e.key!=='pam_q')return;banner();
  try{var o=JSON.parse(e.oldValue||'[]'),n=JSON.parse(e.newValue||'[]');if(o.length&&!n.length){SENT=SENT||o.length;done();}}catch(x){}});
function done(){
  if(!SENT)return;var n=SENT;SENT=0;tip('✔ অফলাইনের '+n+'টা এন্ট্রি Sheet-এ উঠে গেছে',5000);
  try{if(typeof SK!=='undefined'&&SK&&typeof subLoad==='function'){if(!SPEND)subLoad();return;}}catch(e){}
  try{if(typeof TOK!=='undefined'&&TOK&&TOK!=='OFFLINE'&&!document.getElementById('app').classList.contains('hide')&&document.getElementById('modal').classList.contains('hide'))boot();}catch(e){}
}
var ISON=navigator.onLine!==false;
function ONLINE(v){if(ISON!==v){ISON=v;banner();if(v)setTimeout(sync,500);}}
window.addEventListener('online',function(){ONLINE(true);sync();});
window.addEventListener('offline',function(){ONLINE(false);});
setInterval(function(){if(getQ().length)sync();},20000);

/* ---------- little status pill ---------- */
function banner(){
  var b=document.getElementById('ghNet');if(!b){if(!document.body)return;b=document.createElement('div');b.id='ghNet';
    b.style.cssText='position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:99999;padding:5px 12px;border-radius:20px;font:600 13px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:94vw;text-align:center;cursor:pointer';
    b.onclick=function(){sync();};document.body.appendChild(b);}
  var n=getQ().length,off=!ISON||navigator.onLine===false,t='',bg='';
  if(off){t='📴 অফলাইন'+(n?' — '+n+'টা এন্ট্রি ফোনে জমা আছে':'');bg='#fde68a';}
  else if(n&&NEEDLOGIN){t='🔑 নেট এসেছে — একবার লগইন করুন, '+n+'টা জমা এন্ট্রি উঠে যাবে';bg='#fecaca';}
  else if(n){t='⏳ '+n+'টা এন্ট্রি Sheet-এ পাঠানো হচ্ছে…';bg='#bfdbfe';}
  b.textContent=t;b.style.background=bg;b.style.color='#111';b.style.display=t?'block':'none';
}
function tip(m,ms){try{if(typeof toast==='function'){toast(m);return;}}catch(e){}}

/* ---------- first time on a device: ask for the Apps Script link ---------- */
function setupBox(){
  if(document.getElementById('ghSetup')||!document.body)return;
  var d=document.createElement('div');d.id='ghSetup';
  d.style.cssText='position:fixed;inset:0;z-index:100000;background:#0b2a55;color:#fff;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif';
  d.innerHTML='<div style="background:#fff;color:#0f1b2d;border-radius:14px;padding:18px;max-width:460px;width:100%">'+
    '<h2 style="margin:0 0 8px">📮 প্রথমবার সংযোগ</h2><p style="margin:0 0 10px;color:#475569">Apps Script-এর Web app লিংকটা (…/exec) এখানে paste করুন। একবার দিলেই এই ফোনে মনে থাকবে।</p>'+
    '<input id="ghU" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px" placeholder="https:'+'\/\/script.google.com/macros/s/…/exec">'+
    '<p id="ghE" style="color:#b91c1c;margin:6px 0 0"></p><button id="ghB" style="margin-top:10px;width:100%;padding:11px;border:0;border-radius:8px;background:#15803d;color:#fff;font-size:16px;font-weight:700">✔ সংযোগ করুন</button></div>';
  document.body.appendChild(d);
  document.getElementById('ghB').onclick=function(){var v=document.getElementById('ghU').value.trim(),m=v.match(/\/s\/([\w-]{20,})\//)||v.match(/^([\w-]{20,})$/);
    if(!m){document.getElementById('ghE').textContent='লিংকটা ঠিক নয় — …/macros/s/…/exec লিংকটা দিন';return;}
    lset('pam_api',m[1]);location.reload();};
}

/* ---------- google.script.* for this page ---------- */
function runner(){
  var o={_s:null,_f:null},px;
  o.withSuccessHandler=function(f){o._s=f;return px;};o.withFailureHandler=function(f){o._f=f;return px;};o.withUserObject=function(){return px;};
  px=new Proxy(o,{get:function(t,k){if(k in t)return t[k];if(typeof k!=='string'||k==='then')return undefined;return function(){var a=[].slice.call(arguments);
    send(k,a).then(function(r){if(t._s)t._s(r);},function(e){if(t._f)t._f(e);});};}});
  return px;
}
var HCH=null;
window.google={script:{
  get run(){return runner();},
  history:{push:function(st){try{history.pushState(st||{},'',location.pathname+location.search);}catch(e){}},
    replace:function(st){try{history.replaceState(st||{},'',location.pathname+location.search);}catch(e){}},
    setChangeHandler:function(f){HCH=f;}},
  url:{getLocation:function(cb){setTimeout(function(){cb({parameter:P,parameters:{},hash:location.hash.replace(/^#/,'')});},0);}}
}};
window.addEventListener('popstate',function(e){if(HCH)HCH({state:e.state,location:{parameter:P}});});
window.__GH={appUrl:function(){return apiId()?location.origin+location.pathname+'?a='+apiId():'';},sync:sync,queue:getQ};
document.addEventListener('DOMContentLoaded',function(){banner();if(!apiId())setupBox();else setTimeout(sync,1500);});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();

</script>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0b2a55;--p2:#1d4ed8;--bg:#eef2f7;--card:#fff;--tx:#0f1b2d;--mu:#64748b;--bd:#d7dee8;--ok:#15803d;--wa:#1faa53;--pill:#e6ecf4;--line:#edf1f6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans','Noto Sans Bengali','Segoe UI',Roboto,'Nirmala UI',Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:calc(14px*var(--fs,1));-webkit-tap-highlight-color:transparent}

<script>
/* MOBILE FIX: some phones open the page as a wide desktop page, so everything looks tiny.
   Then the phone layout is switched on and the page is scaled to the real screen width. */
(function(){try{
  var W=screen.width||0,V=window.innerWidth||0,VH=window.innerHeight||0;
  if(!(W&&W<=820&&V>W*1.3))return;
  var z=V/W,H=VH/z;
  window.VW=W;window.MOBILE_FIXED=true;
  try{Object.defineProperty(window,'innerWidth',{configurable:true,get:function(){return W;}});Object.defineProperty(window,'innerHeight',{configurable:true,get:function(){return Math.round(H);}});}catch(e){}
  document.documentElement.style.zoom=z;
  var ok=function(c){c=String(c).toLowerCase();if(/(^|[^a-z])print/.test(c)&&!/screen/.test(c))return false;
    return c.split(/\band\b|,/).every(function(p){var m;
      if((m=p.match(/min-width\s*:\s*(\d+)/)))return W>=+m[1];if((m=p.match(/max-width\s*:\s*(\d+)/)))return W<=+m[1];
      if((m=p.match(/min-height\s*:\s*(\d+)/)))return H>=+m[1];if((m=p.match(/max-height\s*:\s*(\d+)/)))return H<=+m[1];
      if(p.indexOf('landscape')>=0)return W>H;if(p.indexOf('portrait')>=0)return H>=W;return true;});};
  var fixSheet=function(sh){var R;try{R=sh.cssRules;}catch(e){return;}if(!R)return;
    for(var i=R.length-1;i>=0;i--){var r=R[i];if(!r.media||!r.cssRules)continue;var c=r.media.mediaText;
      if(!/width|height|orientation/.test(c))continue;
      var inner=[];for(var j=0;j<r.cssRules.length;j++)inner.push(r.cssRules[j].cssText);
      try{sh.deleteRule(i);if(ok(c))for(var q=inner.length-1;q>=0;q--){try{sh.insertRule(inner[q],i);}catch(e){}}}catch(e){}}
    /* vh / vw do not follow the zoom: turn them into fixed sizes of the real screen */
    R=sh.cssRules;
    for(var i2=R.length-1;i2>=0;i2--){var r2=R[i2];if(!r2.selectorText)continue;var tx=r2.cssText;
      if(!/\dv[hw]|\d[dsl]v[hw]/.test(tx))continue;
      var nt=tx.replace(/(-?\d*\.?\d+)[dsl]?(vh|vw)\b/g,function(m,n,u){return (+n*(u==='vh'?H:W)/100).toFixed(2)+'px';});
      try{sh.deleteRule(i2);sh.insertRule(nt,i2);}catch(e){}}};
  var done=[];
  var fixAll=function(){for(var k=0;k<document.styleSheets.length;k++){var t=document.styleSheets[k];if(done.indexOf(t)>=0)continue;
    try{if(t.ownerNode&&t.ownerNode.tagName==='STYLE'){fixSheet(t);done.push(t);}}catch(e){}}};
  fixAll();
  document.addEventListener('DOMContentLoaded',fixAll);window.addEventListener('load',fixAll);
  window.__mfFix=fixAll;
  var watch=function(){try{var mo=new MutationObserver(function(){fixAll();});mo.observe(document.head,{childList:true,subtree:true,characterData:true});
    var wb=function(){if(document.body)mo.observe(document.body,{childList:true});};if(document.body)wb();else document.addEventListener('DOMContentLoaded',wb);}catch(e){}};
  if(document.head)watch();else document.addEventListener('DOMContentLoaded',watch);
  window.addEventListener('orientationchange',function(){setTimeout(function(){location.reload();},400);});
}catch(e){}})();
</script>
<script>
/* dates are always shown as dd/mm/yyyy (the phone date box shows mm/dd/yyyy in some phones).
   Code still reads and writes yyyy-mm-dd through .value, only the box shows dd/mm/yyyy. */
(function(){
  var P=HTMLInputElement.prototype,D=Object.getOwnPropertyDescriptor(P,'value');
  function toI(x){x=String(x==null?'':x).trim();var m=x.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})$/);
    return m?m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2):x;}
  function toD(x){x=String(x==null?'':x);var m=x.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:x;}
  Object.defineProperty(P,'value',{configurable:true,enumerable:D.enumerable,
    get:function(){var x=D.get.call(this);return this.dataset&&this.dataset.dmy?toI(x):x;},
    set:function(x){D.set.call(this,this.dataset&&this.dataset.dmy?toD(x):x);}});
  function fire(e){e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));}
  function fix(e){
    if(e.dataset.dmy)return;var iso=D.get.call(e);
    e.type='text';e.dataset.dmy='1';e.placeholder='dd/mm/yyyy';e.inputMode='numeric';e.maxLength=10;e.autocomplete='off';
    e.value=iso;e.style.paddingRight='34px';
    /* typing 8 digits: slashes come by themselves */
    e.addEventListener('input',function(ev){if(ev.isTrusted===false)return;var raw=D.get.call(e);if(/[^\d\/]/.test(raw))return;
      var dg=raw.replace(/\D/g,'').slice(0,8),o=dg.slice(0,2)+(dg.length>2?'/'+dg.slice(2,4):'')+(dg.length>4?'/'+dg.slice(4):'');
      if(o!==raw&&(ev.inputType||'').indexOf('delete')<0)D.set.call(e,o);});
    /* calendar button */
    var w=document.createElement('span');w.style.cssText='position:relative;display:block';
    e.parentNode.insertBefore(w,e);w.appendChild(e);
    var b=document.createElement('button');b.type='button';b.textContent='📅';b.tabIndex=-1;b.title='ক্যালেন্ডার';
    b.style.cssText='position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;padding:2px 4px;cursor:pointer;font-size:16px;line-height:1';
    w.appendChild(b);
    b.onclick=function(){if(e.readOnly||e.disabled)return;var t=document.createElement('input');t.type='date';
      t.style.cssText='position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0';w.appendChild(t);
      t.value=e.value;t.onchange=function(){if(t.value){e.value=t.value;fire(e);}t.remove();};t.onblur=function(){setTimeout(function(){t.remove();},300);};
      try{t.showPicker();}catch(x){t.focus();t.click();}};
  }
  function scan(r){if(r&&r.querySelectorAll)r.querySelectorAll('input[type=date]').forEach(fix);}
  window.dmyScan=scan;
  document.addEventListener('DOMContentLoaded',function(){scan(document);
    new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1){if(n.matches&&n.matches('input[type=date]'))fix(n);else scan(n);}});});})
      .observe(document.body,{childList:true,subtree:true});});
})();
</script>

function call(fn,...args){
  return new Promise((res,rej)=>{
    $('load').classList.remove('hide');
    let done=false;
    const tm=setTimeout(()=>{if(done)return;done=true;$('load').classList.add('hide');
      const m='সার্ভার থেকে উত্তর আসছে না। সম্ভবত এই ব্রাউজারে একাধিক Google অ্যাকাউন্ট লগইন আছে — InPrivate উইন্ডোতে (Ctrl+Shift+N) লিংকটা খুলে দেখুন।';
      toast(m);rej(new Error(m));},30000);
    google.script.run
      .withSuccessHandler(r=>{if(done)return;done=true;clearTimeout(tm);$('load').classList.add('hide');res(r);})
      .withFailureHandler(e=>{if(done)return;done=true;clearTimeout(tm);$('load').classList.add('hide');const m=(e&&e.message)||String(e);
        if(m.indexOf('SESSION_EXPIRED')>=0){toast('Session expired. Please login again.');logout();}else toast('⚠ '+m);rej(e);})
      [fn](...args);
  });
}

/* ================= RD logic ================= */
function rdInfo(a,onDate){
  const d=onDate||today(), paid=+a.Paid||0;
  const [oy,om,od]=a.OpenDate.split('-').map(Number), [cy,cm,cd]=d.split('-').map(Number);
  let cur=(cy-oy)*12+(cm-om)+1; if(cur<0)cur=0;
  const late=cd>(od<=HALF()?HALF():31);
  const T=termOf(a);
  return {paid,cur,due:Math.max(0,Math.min(cur,T)-paid),left:T-paid,late};
}
function rdSuggest(a,n,onDate){
  const st=S.settings, inf=rdInfo(a,onDate), amt=+a.Amount; let fee=0,adv=0;
  for(let k=inf.paid+1;k<=inf.paid+n;k++){
    if(k<=inf.cur){const delay=(inf.cur-k)+(inf.late?1:0);fee+=delay*amt/100*(+st.DefaultFeePer100||0);} else adv++;
  }
  let reb=0; if(fee===0){ if(adv>=12)reb=amt/100*(+st.Rebate12||0); else if(adv>=6)reb=amt/100*(+st.Rebate6||0); }
  return {fee:Math.round(fee),reb:Math.round(reb),adv};
}
/* 1st half = opened on 1st–15th (deposit by 15th), 2nd half = 16th–end (deposit by month end) */
/* settings helpers */
function stN(k,d){const v=+(S.settings||{})[k];return isFinite(v)&&v>0?v:d;}
function stYes(k){return String((S.settings||{})[k]||'Yes')!=='No';}
function HALF(){return stN('HalfDay',15);}function DEFN(){return stN('DefaultAfter',1);}function SILN(){return stN('SilentAfter',4);}
function cardOn(k){const c=(S.settings||{}).DashCards;return !c||String(c).split(',').indexOf(k)>=0;}
/* fill {name} {acc} … in a WhatsApp template */
function tpl(t,vars){const st=S.settings||{};vars=Object.assign({agent:st.AgentName||'',phone:st.Phone?'('+st.Phone+')':''},vars);
  return String(t||'').replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m).trim();}
function half(a){return (+String(a.OpenDate||'').slice(8,10)||1)<=HALF()?1:2;}
/* installments already in default (not counting this month installment if its last date has not passed) */
function defaults(a){const i=rdInfo(a);return i.late?i.due:Math.max(0,i.due-1);}
function liveRD(a){return a.Scheme==='RD'&&a.Status==='Active'&&(+a.Paid||0)<termOf(a)&&!isMat(a);}
function rdMaturity(p,r){let s=0;for(let k=1;k<=60;k++)s+=p*Math.pow(1+r/400,k/3);return Math.round(s);}

/* everything the dashboard shows, for one book filter (ALL / SELF / SubID) */
function dashData(sf){
  const z=()=>({n:0,amt:0});
  const D={rd:z(),oth:z(),cd:[z(),z()],dd:[z(),z()],paid:z(),today:z(),mat:z(),matO:z(),def:z(),sil:z(),bDue:z(),bUp:z(),bDone:z(),bMat:z()};
  const t=today(),mon=t.slice(0,7),rr=+S.settings.RDRate||0;
  S.accounts.forEach(a=>{
    if(a.Status!=='Active'||!subOk(a.SubAgent,sf))return;
    const amt=+a.Amount||0;
    if(a.Scheme==='RD'){D.rd.n++;D.rd.amt+=amt;
      /* every RD falls in exactly one group, so the four lines add up to the total */
      const g=isDone(a)?D.bDone:isMat(a)?D.bMat:rdInfo(a).due>0?D.bDue:D.bUp;g.n++;g.amt+=amt;}
    else{D.oth.n++;D.oth.amt+=amt;}
    if(a.MaturityDate&&a.MaturityDate.slice(0,7)===mon){
      if(a.Scheme==='RD'){D.mat.n++;D.mat.amt+=rdMaturity(amt,rr);}else{D.matO.n++;D.matO.amt+=amt;}}
    if(!liveRD(a))return;
    const inf=rdInfo(a);
    if(inf.due>0){const x=D.cd[half(a)-1];x.n++;x.amt+=amt*inf.due;}
    const df=defaults(a);
    if(df>=DEFN()){const fee=rdSuggest(a,inf.due).fee;D.def.n++;D.def.amt+=amt*inf.due+fee;
      if(df>=SILN()){D.sil.n++;D.sil.amt+=amt*inf.due+fee;}}
  });
  const seenP=new Set(),seenT=new Set();
  (S.cur||[]).filter(c=>subOk(c.SubAgent,sf)).forEach(c=>{
    D.paid.amt+=+c.Total||0;if(!seenP.has(c.AccNo)){seenP.add(c.AccNo);D.paid.n++;}
    if(c.Date===t){D.today.amt+=+c.Total||0;if(!seenT.has(c.AccNo)){seenT.add(c.AccNo);D.today.n++;}}
  });
  /* deposit due = not yet in a lot for this month: unpaid installments + money taken but not lotted */
  const lotted=new Set((S.lotIdx||[]).filter(x=>x.Month===mon).map(x=>x.AccNo)), unl={};
  (S.unl||[]).forEach(c=>unl[c.AccNo]=(unl[c.AccNo]||0)+(+c.Total||0));
  S.accounts.forEach(a=>{
    if(!liveRD(a)&&!unl[a.AccNo])return;
    if(a.Scheme!=='RD'||a.Status!=='Active'||!subOk(a.SubAgent,sf)||lotted.has(a.AccNo))return;
    const x=D.dd[half(a)-1];
    if(unl[a.AccNo]){x.n++;x.amt+=unl[a.AccNo];}
    else{const d=rdInfo(a).due;if(d>0){x.n++;x.amt+=(+a.Amount||0)*d;}}
  });
  return D;
}

const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function pDate(s){
  s=String(s||'').trim();let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  let y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{m=s.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9}|\d{1,2})[-\/. ](\d{2,4})$/);if(!m)return null;
    d=+m[1];mo=/\d/.test(m[2])?+m[2]:MON[m[2].slice(0,3).toLowerCase()];y=+m[3];if(y<100)y+=2000;}
  if(!mo||mo>12||!d||d>31)return null;
  return {y,mo,d};
}
function ymd(y,mo,d){return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
/* one portal row: Account No | Account Name | Denomination | Month Paid Upto | Next RD Installment DueDate
   Name never contains digits; the due date is missing for accounts with all 60 installments paid. */
const IMP_RE=/(\d{6,})\s+([^\d]+?)\s+(?:Rs\.?\s*|₹\s*)?(\d[\d,]*(?:\.\d+)?)\s*(?:Cr\.?|Dr\.?)?\s+(\d{1,3})(?:\s+(\d{1,4}[-\/. ](?:[A-Za-z]{3,9}|\d{1,2})[-\/. ]\d{2,4}))?(?!\d)/;
function impParse(txt){
  /* PDF copies put every cell on its own line, the portal page uses tabs: join everything into one stream */
  const all=String(txt||'').replace(/ /g,' ').replace(/\s+/g,' ');
  const re=new RegExp(IMP_RE.source,'g');
  const ok=[],bad=[],seen=new Set();let m;
  while((m=re.exec(all))){
    const paid=+m[4], amt=+m[3].replace(/,/g,''), name=m[2].replace(/\b(Cr|Dr)\.?/g,'').trim();
    if(!amt||!name||paid>120){bad.push(m[0]);continue;}
    if(seen.has(m[1]))continue;
    let next='',open='';
    if(m[5]){
      const nd=pDate(m[5]);if(!nd){bad.push(m[0]);continue;}
      /* next due = installment (paid+1); so installment 1 fell (paid) months earlier */
      const t=new Date(nd.y,nd.mo-1-paid,1);
      open=ymd(t.getFullYear(),t.getMonth()+1,nd.d<=15?Math.min(nd.d,15):16);next=ymd(nd.y,nd.mo,nd.d);
    }else if(paid<60||paid%60!==0){bad.push(m[0]);continue;}
    seen.add(m[1]);
    ok.push({acc:m[1],name,amt,paid,next,open,done:!m[5],exists:!!S.amap[m[1]]});
  }
  /* any long account-like number that was not picked up */
  (all.match(/\b\d{9,}\b/g)||[]).forEach(n=>{if(!seen.has(n)){const i=all.indexOf(n);bad.push(all.slice(i,i+80));seen.add(n);}});
  return {ok,bad};
}

function impAdd(){

   ${row('পেস্ট করা পোর্টাল তালিকা',list.length,pTot)}
   ${row('অ্যাপে (Active RD)',app.length,aTot)}
   ${row('পার্থক্য',list.length-app.length,pTot-aTot,pTot!==aTot?'over':'')}

     tbl(['Account','Name','Denom.','Paid'],miss.map(x=>[esc(x.acc),esc(x.name),money(x.amt),x.paid+'/'+(x.paid>60?120:60)+(x.done?' (সম্পূর্ণ — যোগ হবে না)':'')]),[2]):''}
   ${diff.length?`<h3 style="margin:16px 0 6px;font-size:calc(15px*var(--fs,1));color:#b91c1c">কিস্তির টাকা মিলছে না (${diff.length}) — Import চাপলে পোর্টালের টাকা বসে যাবে</h3>`+

/* read the fields out of the OCR text of an India Post RD passbook (first page):

     Address of First Depositor/Guardian: … (several lines, "/" separated)
     A/C Open Date : dd-mm-yyyy | Mode of Operation : SELF | Date Of Birth | Monthly Installment(in Rs): 1000
     Date of Maturity | Agent ID : MI73…   — older passbooks with other labels are also tried */
function parsePassbook(t){
  const T=String(t||'').replace(/\r/g,'').replace(/[|]/g,'/');
  const lines=T.split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean),one=lines.join('\n');
  const grab=re=>{const m=one.match(re);return m&&m[1]?m[1].trim():'';};
  const D='(\\d{1,2}\\s?[-\\/.]\\s?\\d{1,2}\\s?[-\\/.]\\s?\\d{2,4}|\\d{1,2}[-\\s.][A-Za-z]{3,9}[-\\s.,]+\\d{2,4})';
  const toYmd=s=>{if(!s)return '';const d=pDate(s.replace(/\s+/g,'').replace(/[,]+/g,'-'));return d?ymd(d.y,d.mo,d.d):'';};
  const lab=(re)=>toYmd(grab(new RegExp('(?:'+re+')\\s*[:.;\\-]?\\s*'+D,'i')));
  /* holders: "1: 634833179 / SUMAN KAR /" */
  const holders=[];
  lines.forEach(l=>{const m=l.match(/^([123])\s*[:.;]\s*(\d{6,12})?\s*\/\s*([A-Za-z][A-Za-z .']*?)?\s*\/?\s*$/);
    if(m&&(m[2]||m[3]))holders[+m[1]-1]={cif:m[2]||'',name:(m[3]||'').trim()};});
  const cifs=[];one.replace(/(?:C\.?\s*I\.?\s*F\.?(?:\s*(?:ID|No\.?|Number))?|Customer\s*(?:ID|No\.?)|Cust\.?\s*ID)\s*[:.\-]?\s*(\d{6,12})/gi,(m,d)=>{if(cifs.indexOf(d)<0)cifs.push(d);return m;});
  const h1=holders[0]||{},h2=holders[1]||{};
  let acc=grab(/(?:Account|A\s*\/?\s*C)\s*(?:No\.?|Number|Num)\s*[:.\-]?\s*(\d{9,14})/i);
  const allc=[h1.cif,h2.cif].concat(cifs).filter(Boolean);
  if(!acc){const n=(one.match(/\b\d{10,14}\b/g)||[]).filter(x=>allc.indexOf(x)<0);acc=n[0]||'';}
  const dob=lab('Date\\s*of\\s*Birth');
  const mat=lab('Date\\s*of\\s*Maturity|Maturity\\s*Date');
  let open=lab('A\\s*\\/?\\s*C\\s*Open(?:ing)?\\s*Date|Date\\s*of\\s*(?:A\\/?c\\s*)?Open(?:ing|ed)?|Open(?:ing)?\\s*Date|Opened\\s*on');
  if(!open){const all=[];one.replace(new RegExp(D,'g'),m=>{const y=toYmd(m);if(y&&y!==dob&&y!==mat)all.push(y);return m;});open=all[0]||'';}
  /* name: holder line, else a "Name" label */
  let name=h1.name||grab(/(?:Name\s*of\s*(?:the\s*)?(?:Depositor|Account\s*Holder|Holder)|Depositor(?:'s)?\s*Name|^Name)\s*(?:\(?1\)?)?\s*[:.\-]?\s*([A-Za-z][A-Za-z .']{2,60})/im);
  name=name.replace(/\s+(S\/O|W\/O|D\/O|C\/O)\b.*$/i,'').replace(/\s{2,}/g,' ').trim();
  const jName=h2.name||grab(/(?:Second|2nd|Joint)\s*(?:Holder|Depositor|Name)[^A-Za-z]{0,12}([A-Za-z][A-Za-z .']{2,60})/i);
  const guard=grab(/(?:S\/O|W\/O|D\/O|C\/O|Father(?:'s)?\s*(?:\/\s*Husband(?:'s)?)?\s*Name)\s*[:.\-]?\s*([A-Za-z][A-Za-z .']{2,60})/i);
  /* address: lines after "Address of First Depositor/Guardian:" until the next labelled line */
  let addr='';const ai=lines.findIndex(l=>/^address/i.test(l));
  if(ai>=0){const parts=[lines[ai].replace(/^address[^:]{0,}:?\s{0,}/i,'')];
    for(let k=ai+1;k<lines.length&&parts.length<6;k++){
      if(/^(a\s*\/?\s*c|account|date|cif|customer|mode|monthly|nominat|agent|denomination|mobile|phone|signature)/i.test(lines[k]))break;parts.push(lines[k]);}
    addr=parts.join(' / ').split('/').map(s=>s.trim().replace(/[.,]+$/,'')).filter(s=>s&&!/^[,.\s]*$/.test(s)).join(', ').replace(/\s*,\s*,+/g,', ');}
  const amt=grab(/(?:Monthly\s*Instal+ment|Denomination|Monthly\s*Deposit|Instal+ment\s*Amount|Deposit\s*Amount)\s*(?:\(\s*in\s*Rs\.?\s*\))?\s*(?:Rs\.?|₹|INR)?\s*[:.\-]?\s*(?:Rs\.?|₹|INR)?\s*([\d,]+(?:\.\d+)?)/i).replace(/,/g,'');
  const mode=grab(/Mode\s*of\s*Operation\s*[:.\-]?\s*([A-Za-z][A-Za-z ]{1,25})/i);
  const agent=grab(/Agent\s*(?:ID|Code)\s*[:.\-]?\s*([A-Z]{1,4}\.?[A-Z0-9]{6,})/i).replace(/\s/g,'');
  const phone=grab(/(?:Mobile|Mob\.?|Phone|Ph\.?)\s*(?:No\.?)?\s*[:.\-]?\s*(\+?\d[\d\s-]{9,13})/i).replace(/[^\d]/g,'').slice(-10);
  const joint=!!(h2.cif||h2.name)||/joint|either|survivor|jointly/i.test(mode)||(!holders.length&&(cifs.length>1||!!jName));
  return {name,cif:h1.cif||cifs[0]||'',acc,open,dob,mat,addr,amt:amt&&+amt>0?String(+amt):'',phone,guard,mode,agent,
    joint,jointName:jName||'',jointCif:h2.cif||(!holders.length?cifs[1]||'':'')};
}

function imgData(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;rd.onload=()=>{const im=new Image();im.onerror=rej;
  im.onload=()=>{const mx=1800,k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.85).split(',')[1]);};im.src=rd.result;};rd.readAsDataURL(file);});}

let PBIMG=null,PBROT=0;
function pbLoad(){const f0=$('pbF').files[0];if(!f0)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{PBIMG=im;PBROT=0;pbDraw();$('pbV').classList.remove('hide');
    if($('pbDiff'))pbReadEdit(PBACC);else pbRead();};im.src=rd.result;};rd.readAsDataURL(f0);}
/* reads the photo; if nothing useful comes out it turns the photo and tries again by itself */
async function pbOcr(name){
  let r=null,d=null,keep=$('pbK').checked,photo='';
  for(let t=0;t<3;t++){
    if(t)$('pbS').innerHTML='⏳ লেখা ঠিক পাওয়া গেল না — ছবিটা ঘুরিয়ে আবার পড়ছি… ('+(t+1)+'/3)';
    const data=$('pbC0').toDataURL('image/jpeg',0.85).split(',')[1];
    r=await call('api',TOK,'ocrPassbook',{data,mime:'image/jpeg',keep:keep&&!photo,name});
    if(r.photo)photo=r.photo;d=parsePassbook(r.text);
    if(d.acc||d.cif||(d.name&&d.open))break;
    PBROT=(PBROT+(t?180:90))%360;pbDraw();
  }
  if(!(d.acc||d.cif||(d.name&&d.open))){PBROT=(PBROT+90)%360;pbDraw();}
  r.photo=photo;return {r,d};
}
function pbRot(d){PBROT=(PBROT+d+360)%360;pbDraw();}
/* draws the (rotated, shrunk) photo; this canvas is what gets read */
function pbDraw(){const im=PBIMG,c=$('pbC0');if(!im||!c)return;const mx=1800,k=Math.min(1,mx/Math.max(im.width,im.height));
  const w=Math.round(im.width*k),hh=Math.round(im.height*k),side=PBROT%180!==0;c.width=side?hh:w;c.height=side?w:hh;
  const g=c.getContext('2d');g.save();g.translate(c.width/2,c.height/2);g.rotate(PBROT*Math.PI/180);g.drawImage(im,-w/2,-hh/2,w,hh);g.restore();}

    const {r,d}=await pbOcr('passbook-'+Date.now());
    if(d.acc&&S.amap[d.acc]){toast('এই বইটা আগে থেকেই আছে — এটাই ঠিক করার পাতা খুলছি');
      accForm(d.acc);$('pbE').classList.remove('hide');$('pbV').classList.remove('hide');pbDraw();pbShowDiff(d.acc,r,d);return;}
    const set=(id,val)=>{const e=$(id);if(e&&val&&!e.value)e.value=val;};
    set('pbN',d.name);set('pbC',d.cif);set('pbA',d.acc);set('pbO',d.open);set('pbM',d.amt);set('pbG',d.guard);set('pbP',d.phone);set('pbAd',d.addr);set('pbDOB',d.dob);

    const got=[d.name&&'নাম',d.cif&&'CIF',d.acc&&'অ্যাকাউন্ট নম্বর',d.open&&'খোলার তারিখ',d.amt&&'টাকা',d.addr&&'ঠিকানা'].filter(Boolean);
    const myId=String(agentId()).replace(/^DOP\.?/i,'').toUpperCase(),warn=[];

    $('pbS').innerHTML=(got.length?`✔ পাওয়া গেছে: ${got.join(', ')}${d.joint?' • Joint বই':''}। বাকি ঘরগুলো নিজে লিখুন, আর সব মিলিয়ে নিন।`:'⚠ লেখা পড়া গেল না — ↻ দিয়ে সোজা করে আবার 📖 পড়ো চাপুন, অথবা নিজে লিখে দিন।')+(warn.length?'<br>'+warn.join('<br>'):'');
  }catch(e){$('pbS').innerHTML='⚠ '+esc((e&&e.message)||e);}
}

/* "new book from photo" for a book that is already in the app: update that book instead of an error */
async function pbUpdateExisting(a,p){

    ['Name','Guardian','Phone','Address','DOB','CIF'].forEach(k=>{if(p[k])u[k]=p[k];});

      OpenOK:p.OpenDate?'Yes':undefined,Photo:p.Photo||undefined};

}

function pbApply(silent){
  const rows=(PBD&&PBD._rows)||[];let na=0,nc=0;PBCUST=PBCUST||{};if(PBD)PBD._done=true;

async function accSave(isNew){

  if(!S.cmap[cid]){toast('Select a customer from the list');return;}
  const nm=v('gName').trim();if(!nm){toast('গ্রাহকের নাম দিন');return;}
  if(nm!==S.cmap[cid].Name){PBCUST=PBCUST||{};PBCUST.Name=nm;}
  const cf=v('gCIF').replace(/\s/g,''),db=v('gDOB');
  if(db&&!/^\d{4}-\d{2}-\d{2}$/.test(db)){toast('জন্মতারিখ ঠিক নেই — dd/mm/yyyy লিখুন');return;}

  if(db!==(S.cmap[cid].DOB||'')){PBCUST=PBCUST||{};PBCUST.DOB=db;}
  const p={_new:isNew,CustID:cid,AccNo:v('gAcc'),Scheme:v('gSch'),OpenDate:v('gOpen'),Amount:v('gAmt'),MaturityDate:v('gMat'),PaidBefore:v('gPB'),Term:v('gTm'),Holding:v('gHold'),JointName:v('gHold')==='Joint'?v('gJN'):'',JointCIF:v('gHold')==='Joint'?v('gJC'):'',OpenOK:(isNew||v('gOpen')!==((S.amap[v('gAcc')]||{}).OpenDate||'')||($('gOK')&&$('gOK').checked))?'Yes':undefined,Status:v('gSt'),Nominee:v('gNom'),Remarks:v('gRem'),SubAgent:$('gSub').value,Photo:v('gPh')||undefined};
  if(isNew&&S.amap[p.AccNo]){toast('⚠ এই অ্যাকাউন্ট নম্বর ('+p.AccNo+') আগে থেকেই আছে — '+cname(S.amap[p.AccNo].CustID)+'। একই নম্বরে দুটো বই হয় না।');return;}
  try{
    if(PBCUST&&Object.keys(PBCUST).length){const c=S.cmap[cid];
      const dup=PBCUST.CIF&&S.customers.find(x=>x.CIF===PBCUST.CIF&&x.CustID!==cid);

          load(await api('mergeCustomer',{from:cid,to:dup.CustID,update:PBCUST}));p.CustID=dup.CustID;}
        else{const u=Object.assign({},PBCUST);delete u.CIF;if(Object.keys(u).length)load(await api('saveCustomer',Object.assign({CustID:cid,Name:c.Name},u)));}}
      else load(await api('saveCustomer',Object.assign({CustID:cid,Name:c.Name},PBCUST)));}
    load(await api('saveAccount',p));closeM();toast(PBCUST&&Object.keys(PBCUST).length?'✔ বই আর গ্রাহকের তথ্য Saved':'Saved');PBCUST=null;R[CUR]();}catch(e){}
}

/* ⚡ pick accounts so the lot comes as close to the limit as possible (last month ⭐ accounts first) */
function lotAuto(){
  const pick=(cands,cap)=>{const W=cands.map(x=>Math.round(x.it.base));cap=Math.floor(cap);if(cap<=0)return [];
    const take=new Int32Array(cap+1).fill(-1),prev=new Int32Array(cap+1),ok=new Uint8Array(cap+1);ok[0]=1;
    W.forEach((w,i)=>{if(w<=0||w>cap)return;for(let s=cap;s>=w;s--)if(ok[s-w]&&!ok[s]){ok[s]=1;take[s]=i;prev[s]=s-w;}});
    let s=cap;while(s>0&&!ok[s])s--;const out=[];while(s>0){out.push(cands[take[s]]);s=prev[s];}return out;};
  const free=S._lr.due.filter(r=>!LSEL[r.a.AccNo]).map(r=>({r,i:S._lall.indexOf(r),it:lotItem(r,r.n,curMode(S._lall.indexOf(r),r))}));
  if(!free.length){toast('বাছাই করার মতো ডিউ অ্যাকাউন্ট নেই');return;}
  let cap=lotLimit()-lotBase();
  const a1=pick(free.filter(x=>x.r.prev),cap);a1.forEach(x=>{LSEL[x.r.a.AccNo]=x.it;cap-=x.it.base;});
  const a2=pick(free.filter(x=>!LSEL[x.r.a.AccNo]),cap);a2.forEach(x=>{LSEL[x.r.a.AccNo]=x.it;});
  lotRender();toast('⚡ '+(a1.length+a2.length)+'টা অ্যাকাউন্ট বাছাই হলো • বইয়ের টাকা '+money(lotBase())+' — দরকার হলে টিক সরিয়ে দিন');
}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mName(m){if(!m)return '';const [y,mo]=m.split('-');return MN[+mo-1]+'-'+y;}
function mAdd(m,n){const [y,mo]=m.split('-').map(Number);const t=new Date(y,mo-1+n,1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');}
/* installment number that falls in month m for this account */
function instNo(a,m){const [oy,om]=a.OpenDate.split('-').map(Number),[y,mo]=m.split('-').map(Number);return (y-oy)*12+(mo-om)+1;}
function lotLimit(){return +S.settings.LotLimit||20000;}
function lotAmt(a,n){const s=rdSuggest(a,n,v('lDate')||today());return {fee:s.fee,reb:s.reb,base:(+a.Amount)*n,amt:(+a.Amount)*n+s.fee-s.reb};}

function lotRows(){
  const M=LM, prev=mAdd(M,-1), q=v('lq').toLowerCase();
  const lotted={}, prevSet=new Set(), prevMode={};
  (S.lotIdx||[]).forEach(x=>{if(x.Month===M)lotted[x.AccNo]=x.LotNo;if(x.Month===prev){prevSet.add(x.AccNo);prevMode[x.AccNo]=x.Mode;}});
  const unl={};
  (S.unl||[]).forEach(c=>{const u=unl[c.AccNo]=unl[c.AccNo]||{ids:[],total:0,amount:0,months:0,mode:c.Mode||'Cash'};u.ids.push(c.ColID);u.total+=+c.Total||0;u.amount+=+c.Amount||0;u.months+=+c.Months||0;});
  const due=[],paid=[];
  S.accounts.forEach(a=>{
    if(a.Scheme!=='RD'||a.Status!=='Active'||!bookOk(a))return;
    const c=S.cmap[a.CustID]||{};
    if(q&&!(a.AccNo+' '+(c.Name||'')).toLowerCase().includes(q))return;
    const k=instNo(a,M);if(k<1)return;
    const r={a,c,k,prev:prevSet.has(a.AccNo),pm:(stYes('LotRememberMode')&&prevMode[a.AccNo])||(S.settings.LotDefaultMode||'Cash')};
    if(lotted[a.AccNo]){r.st='lot';r.lot=lotted[a.AccNo];paid.push(r);}
    else if(unl[a.AccNo]){r.st='col';r.u=unl[a.AccNo];paid.push(r);}
    else if((+a.Paid||0)>=Math.min(k,termOf(a))){r.st=(+a.Paid||0)>=termOf(a)?'done':'adv';paid.push(r);}
    else{r.st='due';r.n=Math.min(k,termOf(a))-(+a.Paid||0);due.push(r);}
  });
  due.sort((x,y)=>(y.prev-x.prev)||half(x.a)-half(y.a)||x.a.AccNo.localeCompare(y.a.AccNo));
  paid.sort((x,y)=>({col:0,lot:1,adv:2,done:3}[x.st]-{col:0,lot:1,adv:2,done:3}[y.st])||x.a.AccNo.localeCompare(y.a.AccNo));
  return {due,paid,prevSet};
}

function lotItem(r,n,mode){
  if(r.st==='col')return {acc:r.a.AccNo,colIds:r.u.ids,amt:r.u.total,base:r.u.amount||r.u.total,col:true,mode:r.u.mode};

}
function lotTotal(){return Object.values(LSEL).reduce((s,x)=>s+x.amt,0);}
/* book amount = installments only; the lot limit is checked on this (fine not counted) */
function lotBase(){return Object.values(LSEL).reduce((s,x)=>s+(x.base!=null?x.base:x.amt),0);}
function lotByMode(){const o={Cash:{n:0,amt:0},Online:{n:0,amt:0},Credit:{n:0,amt:0}};
  Object.values(LSEL).forEach(x=>{const m=o[x.mode]?x.mode:'Cash';o[m].n++;o[m].amt+=x.amt;});return o;}
/* how the customer paid: নগদ / অনলাইন / ধার (ধার = I paid it; goes into the ধার খাতা on confirm) */
const MODES=[['Cash','নগদ'],['Online','অনলাইন'],['Credit','ধার']];
function modeName(m){return (MODES.find(x=>x[0]===m)||MODES[0])[1];}
function modeSel(i,m){return `<select id="lmd${i}" class="msel m-${m}" onchange="lotMode(${i},this.value)">${MODES.map(x=>`<option value="${x[0]}" ${x[0]===m?'selected':''}>${x[1]}</option>`).join('')}</select>`;}
function curMode(i,r){const e=$('lmd'+i);return e?e.value:r.pm;}
function lotMode(i,m){
  const r=S._lall[i];if(!r)return;

function lotTick(i,on){

  if(lotBase()+it.base>lotLimit())toast('⚠ বইয়ের টাকা '+money(lotLimit())+'-এর বেশি হয়ে যাচ্ছে');
  LSEL[r.a.AccNo]=it;lotSum();
}
function lotN(i,val){
  const r=S._lall[i];let n=parseInt(val,10);if(!(n>=1))return;n=Math.min(n,termOf(r.a)-(+r.a.Paid||0));
  const it=lotItem(r,n,LSEL[r.a.AccNo]?LSEL[r.a.AccNo].mode:curMode(i,r));{const le=$('lam'+i);if(le)le.textContent=money(it.base);}
  if(LSEL[r.a.AccNo]){LSEL[r.a.AccNo]=it;lotSum();}else r.n=n;

function lotAll(on){

  lotRender();if(skip)toast(skip+'টা অ্যাকাউন্ট বাদ — '+money(lotLimit())+'-এর সীমা পেরিয়ে যেত');

/* tick every money-taken / sub-agent-ticked book, stopping at the lot limit (book amount) */
function lotAllCol(on){

function lotRemind(){

  lotRender();toast(n+'টা অ্যাকাউন্ট বাছাই হলো'+(skip?' • '+skip+'টা সীমার জন্য বাদ':''));

function lotSum(){

async function repColl(pr){
  let L=[];try{L=await api('getCollections',{from:v('rF'),to:v('rT')});}catch(e){return;}
  const sb=v('rsub');L=L.filter(c=>subOk(c.SubAgent,sb));
  const t=k=>L.reduce((s,c)=>s+(+c[k]||0),0);
  const head=['Date','Receipt','Account','Name','Book of','Inst.','Amount','Fee','Rebate','Total','Lot'];
  const rows=L.map(c=>[fd(c.Date),c.ColID,esc(c.AccNo),esc(c.Name),esc(subName(c.SubAgent)),c.Months,money(c.Amount),money(c.DefaultFee),money(c.Rebate),money(c.Total),c.LotNo]);
  const sum=`<b>${L.length}</b> entries • Amount ${money(t('Amount'))} • Fee ${money(t('DefaultFee'))} • Rebate ${money(t('Rebate'))} • <b>Total ${money(t('Total'))}</b>`;
  const mk=m=>{m=String(m||'').toLowerCase();return m.indexOf('credit')>=0?'Credit':(m.indexOf('online')>=0||m.indexOf('upi')>=0||m.indexOf('cheque')>=0)?'Online':'Cash';};
  const bm={Cash:0,Online:0,Credit:0};L.forEach(c=>bm[mk(c.Mode)]+=+c.Total||0);
  const msum=MODES.map(x=>`${x[1]}: <b>${money(bm[x[0]])}</b>`).join(' • ');
  if(!pr){$('rc').innerHTML=`<p>${sum}</p><p class="mchips">${MODES.map(x=>`<span class="mc m-${x[0]}">${x[1]}: <b>${money(bm[x[0]])}</b></span>`).join('')}</p>`+tbl(head,rows,[5,6,7,8,9]);return;}
  printDoc('Collection Report',`<h3>COLLECTION REPORT: ${fd(v('rF'))} to ${fd(v('rT'))}</h3><p style="text-align:center"><b>Book of: ${esc(subLabel(sb))}</b></p><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>
   ${rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${i>=5&&i<=9?'num':''}">${c}</td>`).join('')+'</tr>').join('')}</table><p>${sum}</p><p>${msum}</p>`);
}
async function repComm(pr){
  let d;try{d=await api('commission',{month:v('rM')});}catch(e){return;}
  d.cutRule=d.cutRule||{above:stN('SubCutAbove',50000),pct:+S.settings.SubCutPct||0};d.bySub=(d.bySub||[]).map(b=>Object.assign({book:(b.rd||0)+(b.oth||0),cut:0,cutOn:false},b));
  if(d.subPay==null)d.subPay=d.bySub.reduce((s,b)=>s+(b.payable||0),0);
  const h=`<table><tr><th>Item</th><th>Deposit</th><th>Rate</th><th>Commission</th></tr>
   <tr><td>RD installments</td><td class="num">${money(d.rdAmt)}</td><td>${d.rates.rd}%</td><td class="num">${money(d.rdC)}</td></tr>
   <tr><td>Other schemes opened (${d.oth.length})</td><td class="num">${money(d.othAmt)}</td><td>${d.rates.oth}%</td><td class="num">${money(d.oC)}</td></tr>
   <tr><th colspan="3">Gross commission</th><th class="num">${money(d.gross)}</th></tr>
   <tr><td colspan="3">Less TDS (${d.rates.tds}%)</td><td class="num">${money(d.tds)}</td></tr>
   <tr><th colspan="3">Net commission</th><th class="num">${money(d.net)}</th></tr></table>
   <h3 style="margin-top:14px;text-align:left">বই অনুযায়ী কমিশন</h3>
   <p style="font-size:calc(12px*var(--fs,1));margin:2px 0 6px">সাব-এজেন্টের বইয়ের টাকা ${money(d.cutRule.above)}-এর বেশি হলে তাঁর কমিশনের ${d.cutRule.pct}% কেটে নিজস্ব কমিশনে যায়।</p>
   <table><tr><th>Book of</th><th>বইয়ের টাকা</th><th>Commission</th><th>ভাগ</th><th>${d.cutRule.pct}% কাটা</th><th>দিতে হবে</th></tr>
   ${d.bySub.map(b=>`<tr><td>${esc(b.name)}</td><td class="num">${money(b.book)}</td><td class="num">${money(b.comm)}</td><td>${b.sub?b.share+'%':'-'}</td><td class="num">${b.cutOn?money(b.cut):'-'}</td><td class="num">${b.sub?money(b.payable):'-'}</td></tr>`).join('')}
   <tr><th colspan="5">সাব-এজেন্টদের মোট দিতে হবে</th><th class="num">${money(d.subPay)}</th></tr>
   <tr><th colspan="5">নিজস্ব কমিশন (নিজের বই + সাব-এজেন্টদের থেকে কাটা)</th><th class="num">${money(d.ownComm)}</th></tr></table>`;
  if(!pr){$('rm').innerHTML='<div class="tw">'+h+'</div>';return;}
  printDoc('Commission '+d.month,`<h3>COMMISSION STATEMENT — ${d.month}</h3>${h}`);
}

function setField(k,lab,type,opt){
  const val=S.settings[k]==null?'':S.settings[k], help=typeof opt==='string'?`<small class="mu">${opt}</small>`:'';
  if(type==='sel')return `<div><label>${lab}</label><select id="S_${k}">${opt.map(o=>`<option value="${o[0]}" ${o[0]===val?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
  if(type==='chk'){const on=val?String(val).split(','):opt.map(o=>o[0]);
    return `<div style="flex:1 1 100%"><div class="chkgrid">${opt.map(o=>`<label class="chk"><input type="checkbox" class="S_${k}" value="${o[0]}" ${on.indexOf(o[0])>=0?'checked':''}> ${o[1]}</label>`).join('')}</div></div>`;}
  if(type==='txt')return `<div style="flex:1 1 100%"><label>${lab}</label><textarea id="S_${k}" rows="4">${esc(val)}</textarea><small class="mu">ব্যবহার করা যায়: ${esc(opt)}</small></div>`;
  if(type==='scolor')return `<div><label>${lab}</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="color" id="S_${k}" value="${esc(val||'#ffffff')}" style="width:64px;height:40px;padding:2px" oninput="sideColor(this.value)">
    ${['#ffffff','#0b2a55','#1e293b','#14532d','#4c1d95','#7c2d12','#fef3c7','#e0f2fe'].map(c=>`<button class="ib" title="${c}" style="width:30px;height:30px;border-radius:50%;border:1px solid #cbd5e1;background:${c}" onclick="$('S_${k}').value='${c}';sideColor('${c}')"></button>`).join('')}</div><small class="mu">সাদা = আগের মতো। বেছে নিলে সঙ্গে সঙ্গে দেখাবে, রাখতে নিচে Save Settings।</small></div>`;
  if(type==='color')return `<div><label>${lab}</label><div style="display:flex;gap:8px;align-items:center"><input type="color" id="S_${k}" value="${esc(val||'#0b2a55')}" style="width:64px;height:40px;padding:2px">
    ${['#0b2a55','#b71c1c','#14532d','#4c1d95','#0f766e','#7c2d12'].map(c=>`<button class="ib" style="width:30px;height:30px;border-radius:50%;background:${c}" onclick="$('S_${k}').value='${c}'"></button>`).join('')}</div></div>`;
  return `<div><label>${lab}</label><input id="S_${k}" type="${type==='num'||type==='num0'?'number':'text'}" step="any" ${type==='num0'?'min="0"':''} value="${esc(val)}">${help}</div>`;
}

function logoPick(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const mx=200,k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      let d=c.toDataURL('image/png');if(d.length>45000)d=c.toDataURL('image/jpeg',0.85);if(d.length>45000)d=c.toDataURL('image/jpeg',0.6);
      logoSave(d);};im.onerror=()=>toast('ছবিটা খোলা গেল না');im.src=rd.result;};rd.readAsDataURL(f);}
async function logoSave(d){if(!d&&!confirm('লোগো সরিয়ে দেবো?'))return;
  try{load(await api('saveLogo',{data:d}));toast(d?'✔ লোগো রাখা হলো':'লোগো সরানো হলো');R.set();}catch(e){}}
async function subWaSave(){const map={};document.querySelectorAll('.swa').forEach(c=>map[c.value]=c.checked?'Yes':'No');
  try{load(await api('setSubWa',{map}));toast('✔ WhatsApp-এর অনুমতি রাখা হলো');}catch(e){}}

let SM='',STMD='';
function ordinal(n){n=+n;const s=(n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');return n+s;}

const MFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function mFull(m){const [y,mo]=m.split('-');return MFULL[+mo-1]+' '+y;}
function fyOf(m){const [y,mo]=m.split('-').map(Number);return mo>=4?y:y-1;}
function fyMonths(fy){const o=[];for(let i=0;i<12;i++)o.push(mAdd(fy+'-04',i));return o;}
function commOf(dep){return Math.round(dep*stN('RDComm',4))/100;}
function tdsOf(c){const t=c*(+(S.settings||{}).TDS||0)/100;return stYes('RoundTDS')?Math.round(t):Math.round(t*100)/100;}
/* all lines of one month: lots (by lot date) + lines added by hand */
function stmRows(m){
  const L=[];
  (S.lots||[]).filter(l=>String(l.Date).slice(0,7)===m).forEach(l=>{const fine=+l.DefaultFee||0,dep=(+l.Total||0)-fine;
    L.push({kind:'lot',id:l.LotNo,date:l.Date,ref:l.RefNo||'',label:'',dep,fine});});
  (S.stmt||[]).filter(r=>r.Month===m).forEach(r=>L.push({kind:'man',id:r.RowID,date:r.Date,ref:r.RefNo,label:r.Label,dep:+r.Deposit||0,fine:+r.Fine||0}));
  L.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.kind==='lot'?-1:1));
  L.forEach(r=>{r.total=r.dep+r.fine;r.comm=commOf(r.dep);r.tds=tdsOf(r.comm);});
  return L;
}
/* totals: TDS is worked out on the total commission (same as the old sheet: 11440 x 2% = 229) */
function stmSum(L){const s=L.reduce((s,r)=>({dep:s.dep+r.dep,fine:s.fine+r.fine,total:s.total+r.total,comm:s.comm+r.comm}),{dep:0,fine:0,total:0,comm:0});s.tds=tdsOf(s.comm);return s;}
function yrSum(Y){const s=Y.reduce((a,x)=>({dep:a.dep+x.s.dep,fine:a.fine+x.s.fine,total:a.total+x.s.total,comm:a.comm+x.s.comm}),{dep:0,fine:0,total:0,comm:0});s.tds=tdsOf(s.comm);return s;}
function agentId(){const st=S.settings||{};return st.PortalID||st.AgentCode||'';}
function n2(x){return (Math.round((+x||0)*100)/100).toFixed(2);}

  $('s-stm').innerHTML=`<div class="card"><div class="row">

     ${stmWrong()}

/* one row of the old sheet (cells of a single month block) -> {Date,RefNo,Label,Deposit,Fine} or null */
function stmCells(cells){
  cells=cells.map(c=>String(c||'').trim()).filter(c=>c!=='');
  if(!cells.length||cells.some(c=>/^(total|month\s*:|agent id|deposit|sl$|sl\s*no|year\s*:)/i.test(c)))return null;
  let date='',ref='',label=[],nums=[];
  cells.forEach(c=>{
    const d=pDate(c);
    if(!date&&d&&/[-\/.]/.test(c)){date=ymd(d.y,d.mo,d.d);return;}
    if(!ref&&/^[A-Za-z]{0,3}\d{6,}$/.test(c)){ref=c;return;}
    const n=c.replace(/,/g,'');
    if(/^-?\d+(\.\d+)?$/.test(n)){nums.push(+n);return;}
    label.push(c);
  });
  if(!date&&!ref&&!label.length)return null;
  /* first small integer is the Sl No */
  if(nums.length>=3&&Number.isInteger(nums[0])&&nums[0]<100)nums.shift();
  const dep=nums[0]||0,fine=nums[1]||0;
  return dep>0?{Date:date,RefNo:ref,Label:label.join(' '),Deposit:dep,Fine:fine}:null;
}
const MLOOK={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
/* whole sheet: finds every "Month : - April 2026" (or just "Month : - April") header — two months side by side are fine —
   and files each row under it. A header without the year takes it from the dates in its rows (April–March = one year). */
function stmParse(txt,fallbackMonth){
  const out=[];let blocks=null;const all=[],raw=[];
  String(txt||'').split(/\r?\n/).forEach(line=>{
    const cells=line.split('\t');
    if(/month\s*:/i.test(line)){
      blocks=[];
      cells.forEach((c,i)=>{const m=String(c).match(/month\s*:\s*-?\s*([A-Za-z]{3,})\.?\s*[-,]?\s*(\d{4})?/i);
        const mo=m&&MLOOK[m[1].slice(0,3).toLowerCase()];
        if(mo){const b={col:i,mo,y:m[2]?+m[2]:0,rows:[]};blocks.push(b);all.push(b);}});
      if(!blocks.length)blocks=null;
      return;
    }
    if(/yearly summary|year\s*:\s*-/i.test(line)){blocks=[];return;}
    if(blocks&&blocks.length){
      blocks.forEach((b,k)=>{const end=k+1<blocks.length?blocks[k+1].col:cells.length;
        const r=stmCells(cells.slice(b.col,end));if(r)b.rows.push(r);});
    }else if(!blocks&&fallbackMonth){if(cells.length>1)raw.push(cells);else{const r=stmCells(line.trim().split(/\s{2,}|\s(?=\d)/));if(r)out.push(Object.assign(r,{Month:fallbackMonth}));}}
  });
  /* rows copied without the "Month :" headers: two months may sit side by side (April | May).
     Find the columns that hold dates; each one starts a separate month block. With more than one block
     every row goes to the month of its own date (a row without a date stays with the row above it). */
  if(raw.length){
    const cnt={};raw.forEach(c=>c.forEach((x,i)=>{const d=pDate(x);if(d&&/[-\/.]/.test(x))cnt[i]=(cnt[i]||0)+1;}));
    const mx=Math.max(0,...Object.values(cnt));
    const dc=Object.keys(cnt).map(Number).filter(i=>cnt[i]>=Math.max(2,mx*0.2)).sort((a,b)=>a-b)
      .filter((c,k,arr)=>k===0||c-arr[k-1]>=4);
    if(dc.length<2)raw.forEach(c=>{const r=stmCells(c);if(r)out.push(Object.assign(r,{Month:fallbackMonth}));});
    else{
      const st=dc.map((c,k)=>k===0?0:Math.max(dc[k-1]+1,c-1));
      st.forEach((a,k)=>{const b=k+1<st.length?st[k+1]:1e9;let last='';
        raw.forEach(c=>{const r=stmCells(c.slice(a,b));if(!r)return;
          const m=r.Date?r.Date.slice(0,7):last||fallbackMonth;last=m;out.push(Object.assign(r,{Month:m}));});});
    }
  }
  /* years: from the header, else from a date in the block, else from the financial year of the other months */
  all.forEach(b=>{if(!b.y){const d=b.rows.find(r=>r.Date&&+r.Date.slice(5,7)===b.mo);if(d)b.y=+d.Date.slice(0,4);}});
  const known=all.find(b=>b.y);
  if(known){const fy=known.mo>=4?known.y:known.y-1;all.forEach(b=>{if(!b.y)b.y=b.mo>=4?fy:fy+1;});}
  else if(fallbackMonth){const fy=fyOf(fallbackMonth);all.forEach(b=>{if(!b.y)b.y=b.mo>=4?fy:fy+1;});}
  all.forEach(b=>{if(!b.y)return;const M=b.y+'-'+String(b.mo).padStart(2,'0');b.rows.forEach(r=>out.push(Object.assign(r,{Month:M})));});
  return out;
}

  for(let i=0;i<n;i++){const r=L[i];

function stmPrint(){

  const per=+v('spN')||4,minR=Math.max(0,parseInt(v('spR'),10)||0),ms=[];
  for(let m=a;m<=b&&ms.length<60;m=mAdd(m,1))ms.push(m);

  const html=pages.map(pm=>{const nr=Math.max(minR,...pm.map(m=>stmRows(m).length));
    return `<div class="pg n${per}"><div class="in">${pm.map(m=>stmBlock(m,nr)).join('')}</div></div>`;}).join('')+

let SQ=Promise.resolve(),SPEND=0;
function callQ(fn,...args){

  SQ=p.catch(()=>{});

let SB=null,SBR='m0',SBQ='';
function sbRange(k){const t=today(),y=+t.slice(0,4),mo=+t.slice(5,7),fy=mo>=4?y:y-1,m=t.slice(0,7),last=d=>{const [a,b]=d.split('-').map(Number);return d+'-'+String(new Date(a,b,0).getDate()).padStart(2,'0');};
  if(k==='m0')return [m+'-01',last(m)];if(k==='m1'){const p=mAdd(m,-1);return [p+'-01',last(p)];}
  if(k==='fy')return [fy+'-04-01',(fy+1)+'-03-31'];if(k==='fy1')return [(fy-1)+'-04-01',fy+'-03-31'];return ['',''];}
async function sbOpen(k){

}

     <div style="margin-top:8px;font-size:calc(15px*var(--fs,1))">মোট <b>${money(tot)}</b> • ${R.length}টা কিস্তি-জমা<br><small class="mu">আমি নিয়েছি ${money(by.me)} • এজেন্ট নিয়েছেন ${money(by.agent)}</small></div>

     ${days[d].map(r=>`<div class="sent" style="justify-content:space-between;border-top:1px solid #eef2f7;padding-top:6px;cursor:pointer" onclick="sbAcc('${esc(r.acc)}')">

}
async function sbNoteSave(acc){
  if(SUBBUSY.note)return;SUBBUSY.note=1;const [f,t]=sbRange(SBR);

    r.items.map(x=>`<div class="nl">👤 <b>${esc(x.name)}</b> ${x.n}টা বইয়ে টিক দিয়েছেন — ${money(x.total)}<br><small class="mu">নগদ ${x.Cash} • অনলাইন ${x.Online} • ধার ${x.Credit}</small></div>`).join('')+

/* ---- mobile number rule (same as the server): 10 digits, not starting with 0, no +91 ---- */
function phoneCheck(raw){const v=String(raw==null?'':raw).trim();if(!v)return {ok:true,val:''};
  if(/^\+/.test(v))return {ok:false,msg:'+91 লিখবেন না — শুধু ১০ অঙ্কের নম্বর দিন'};
  const d=v.replace(/[\s-]/g,'');if(/\D/.test(d))return {ok:false,msg:'মোবাইল নম্বরে শুধু সংখ্যা দিন'};
  if(d.charAt(0)==='0')return {ok:false,msg:'মোবাইল নম্বর 0 দিয়ে শুরু হবে না'};
  if(d.length>10)return {ok:false,msg:'মোবাইল নম্বর ১০ অঙ্কের বেশি হয়েছে'};
  if(d.length<10)return {ok:false,msg:'মোবাইল নম্বর পুরো ১০ অঙ্কের দিন'};return {ok:true,val:d};}
/* every mobile box: only digits, never more than 10 (extra digits are refused with a warning), + and a leading 0 are warned at once */
document.addEventListener('input',function(e){const t=e.target;if(!t||!t.matches||!t.matches('input[type=tel]'))return;
  let v=t.value;
  if(v.indexOf('+')>=0){t.value='';t._plus=1;toast('⚠ +91 লিখবেন না — শুধু ১০ অঙ্কের নম্বর দিন');t.style.borderColor='#dc2626';return;}
  let d=v.replace(/\D/g,'');if(!d)t._plus=0;
  if(d.length>10){if(t._plus){d=d.slice(0,12);toast('⚠ +91 / 91 বাদ দিয়ে শুধু ১০ অঙ্ক লিখুন');}
    else{d=d.slice(0,10);toast('⚠ মোবাইল নম্বর ১০ অঙ্কের বেশি হয় না — প্রথম ১০টা অঙ্ক রাখা হলো');}}
  if(d.charAt(0)==='0')toast('⚠ মোবাইল নম্বর 0 দিয়ে শুরু হবে না');
  if(t.value!==d)t.value=d;
  t.style.borderColor=d&&(d.length!==10||d.charAt(0)==='0'||t._plus)?'#dc2626':'';},true);

   </div>
   <div class="card"><h2>Edit Profile</h2><div class="grid">
     ${f('P_AgentName','এজেন্টের নাম',st.AgentName)}${f('P_AgentCode','এজেন্সি নম্বর',st.AgentCode)}${f('P_AgentType','এজেন্ট ধরন (MPKBY / SAS)',st.AgentType)}
     ${f('P_AgencyValid','এজেন্সি ভ্যালিডিটি (Valid till)',st.AgencyValid,'date')}${f('P_PostOffice','পোস্ট অফিসের নাম',st.PostOffice)}${f('P_Address','ঠিকানা',st.Address)}
     ${f('P_District','জেলা',st.District)}${f('P_Pin','পিন কোড',st.Pin,'text','inputmode="numeric" maxlength="6"')}${f('P_Phone','ফোন',st.Phone,'tel')}
     ${f('P_PortalLink','পোর্টাল লিংক',st.PortalLink)}${f('P_PortalID','পোর্টাল ID',st.PortalID)}
     ${f('P_PortalPw','পোর্টাল পাসওয়ার্ড'+(st.HasPortalPw?' (বদলালে তবেই লিখুন)':''),'','password','autocomplete="new-password"')}
     ${f('P_PwChanged','শেষ কবে পাসওয়ার্ড বদলেছেন',st.PwChanged,'date')}</div>
    <div style="margin-top:12px"><button class="btn" onclick="profSave()">Save Profile</button></div>
    <p class="mu" style="margin-top:10px">🔒 পোর্টাল পাসওয়ার্ড আপনার নিজের Google শিটে থাকে, আর এই অ্যাপের লগইন পাসওয়ার্ড দিয়ে সুরক্ষিত। অ্যাপের লগইন পাসওয়ার্ড (Settings) শক্ত রাখুন, আর শিটটা কারও সঙ্গে শেয়ার করবেন না।</p></div>`;
};
async function profSave(){
  if(!phOk('P_Phone'))return;
  const st=S.settings,keys=['AgentName','AgentCode','AgentType','AgencyValid','PostOffice','Address','District','Pin','Phone','PortalLink','PortalID','PwChanged'];
  const p={};keys.forEach(k=>p[k]=v('P_'+k));
  const pw=$('P_PortalPw').value;
  if(pw){p.PortalPw=pw;if(p.PwChanged===(st.PwChanged||''))p.PwChanged=today();}
  if(p.Pin&&!/^\d{6}$/.test(p.Pin)){toast('পিন কোড ৬ অঙ্কের হবে');return;}
  try{load(await api('saveSettings',p));toast('Profile saved');go('prof');}catch(e){}
}
async function pwToday(){
  if(!confirm('আজকের তারিখ ('+fd(today())+') শেষ পাসওয়ার্ড বদল হিসেবে রাখবো?\nনতুন পাসওয়ার্ডটাও Edit Profile-এ লিখে রাখতে পারেন।'))return;
  try{load(await api('saveSettings',{PwChanged:today()}));toast('✔ পরের বদল '+fd(pwExpiry()));go('prof');}catch(e){}
}
async function pwShow(){try{const pw=await api('getPortalPw');$('ppw').textContent=pw||'—';setTimeout(()=>{const e=$('ppw');if(e)e.textContent='••••••••';},15000);}catch(e){}}
async function pwCopy(){try{copyTxt(await api('getPortalPw'),'Password');}catch(e){}}
function copyTxt(t,lab){
  const done=()=>toast(lab+' কপি হয়েছে');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback());}else fallback();
  function fallback(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){toast(t);}a.remove();}
}

/* ================= Printing ================= */
function printDoc(title,body){
  const st=S.settings;
  showPrint('gen',title,`<div class="paper"><div class="hd">${st.Logo?`<img src="${st.Logo}" style="height:60px;float:left;margin-right:10px">`:''}<h2>${esc(st.AgentName)}</h2><div>Authorised Post Office Agent (${esc(st.AgentType)})${st.AgentCode?' — Code: '+esc(st.AgentCode):''}</div>
   <div>${[st.PostOffice&&('Post Office: '+esc(st.PostOffice)),esc(st.Address),st.District&&('Dist: '+esc(st.District)),st.Pin&&('PIN: '+esc(st.Pin)),st.Phone&&('Ph: '+esc(st.Phone))].filter(Boolean).join(' | ')}</div></div>
   ${body}</div>`,'12mm');
}
/* print preview inside the app (works on phones too — no pop-up window). Only the paper is printed. */
function showPrint(kind,title,html,margin){
  closePrint();
  const pv=document.createElement('div');pv.id='pv';
  pv.innerHTML=`<div class="pvbar"><b>${esc(title)}</b><span><button class="tbtn" onclick="doPrint()">🖨 Print</button> <button class="tbtn" style="background:#fee2e2;color:#991b1b" onclick="closePrint()">✕ বন্ধ</button></span></div>
    <div id="pvDoc" class="${kind}">${html}</div>`;
  document.body.appendChild(pv);
  let ps=$('pvPage');if(!ps){ps=document.createElement('style');ps.id='pvPage';document.head.appendChild(ps);}
  ps.textContent='@page{size:A4 portrait;margin:'+margin+'}';
  document.documentElement.classList.add('printing');
  /* fit each statement page into one A4 sheet */
  pv.querySelectorAll('.pg').forEach(pg=>{const inn=pg.querySelector('.in');
    const z=Math.min(pg.clientHeight/inn.scrollHeight,pg.clientWidth/inn.scrollWidth,1);if(z<1)inn.style.zoom=z;});
  pvFit();
}
function pvFit(){const d=$('pvDoc');if(!d)return;d.style.zoom='';const p=d.querySelector('.paper,.pg');if(!p)return;
  const z=Math.min(1,(window.innerWidth-16)/p.offsetWidth);if(z<1)d.style.zoom=z;}
function doPrint(){const d=$('pvDoc');if(d)d.style.zoom='';setTimeout(()=>{window.print();setTimeout(pvFit,500);},50);}
function closePrint(){const p=$('pv');if(p)p.remove();document.documentElement.classList.remove('printing');}
window.addEventListener('resize',()=>{if($('pv'))pvFit();});
function printReceipt(c){
  const a=S.amap[c.AccNo]||{};
  const one=copy=>`<div style="border:1px dashed #555;padding:8px;margin-bottom:14px"><h3>RD DEPOSIT RECEIPT <small>(${copy})</small></h3><table>
   <tr><th>Receipt No</th><td>${c.ColID}</td><th>Date</th><td>${fd(c.Date)}</td></tr>
   <tr><th>Account No</th><td>${esc(c.AccNo)}</td><th>Name</th><td>${esc(c.Name)}</td></tr>
   <tr><th>Denomination</th><td>${money(a.Amount)}</td><th>Installments</th><td>${c.Months} (No. ${c.FromInst}–${c.ToInst} of ${termOf(a)})</td></tr>
   <tr><th>Amount</th><td>${money(c.Amount)}</td><th>Default Fee</th><td>${money(c.DefaultFee)}</td></tr>
   <tr><th>Rebate</th><td>${money(c.Rebate)}</td><th>Total Received</th><td><b>${money(c.Total)}</b></td></tr>
   <tr><th>Mode</th><td>${esc(c.Mode)}</td><th>Remarks</th><td>${esc(c.Remarks)}</td></tr>
   ${c.SubAgent?`<tr><th>Sub-Agent</th><td colspan="3">${esc(subName(c.SubAgent))}${(S.smap[c.SubAgent]||{}).Phone?' — Ph: '+esc(S.smap[c.SubAgent].Phone):''}</td></tr>`:''}</table>
   <div class="sg" style="margin-top:30px"><span>Depositor</span><span>Agent's Signature</span></div></div>`;
  printDoc('Receipt '+c.ColID,one('Depositor copy')+one('Agent copy'));
}

/* ================= Start ================= */
document.addEventListener('keydown',e=>{if(e.key==='/'&&TOK&&!$('app').classList.contains('hide')&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){e.preventDefault();qsOpen();}});
/* text size for this device: stored in the browser; phones start a little bigger */
const FSZ=[[0.9,'ছোট'],[1,'স্বাভাবিক'],[1.12,'বড়'],[1.25,'আরো বড়'],[1.4,'খুব বড়']];
function fsGet(){let v=null;try{v=localStorage.getItem('pam_fs');}catch(e){}return v?+v:((window.VW||window.innerWidth)<=640?1.12:1);}
function fsSet(v){try{localStorage.setItem('pam_fs',String(v));}catch(e){}document.documentElement.style.setProperty('--fsu',String(v));}
function fsStep(d){const i=FSZ.findIndex(x=>x[0]>=fsGet()-0.001);const j=Math.max(0,Math.min(FSZ.length-1,(i<0?1:i)+d));fsSet(FSZ[j][0]);toast('লেখার মাপ: '+FSZ[j][1]);}
document.documentElement.style.setProperty('--fsu',String(fsGet()));
/* the agent logo (Settings): login page, sidebar, top bar, sub-agent page, printed pages */
function applyLogo(u){u=u||'';try{if(u)localStorage.setItem('pam_logo',u);else localStorage.removeItem('pam_logo');}catch(e){}
  ['lgLogo','sbLogo','tbLogo'].forEach(id=>{const e=$(id);if(!e)return;if(u){e.src=u;e.classList.remove('hide');}else{e.removeAttribute('src');e.classList.add('hide');}});
  const ic=$('lgIc');if(ic)ic.style.display=u?'none':'';}
(function(){let u='';try{u=localStorage.getItem('pam_logo')||'';}catch(e){}if(u)applyLogo(u);})();
function mainStart(){
  try{google.script.run.withSuccessHandler(r=>{if(r)applyLogo(r.logo);}).withFailureHandler(()=>{}).publicInfo();}catch(e){}try{const t=localStorage.getItem('tok');if(t){TOK=t;boot().catch(()=>logout());}}catch(e){}}
/* a link with ?s=KEY opens the sub-agent page (only his books, no password) */
window.onload=()=>{
  try{if(typeof google!=='undefined'&&google.script&&google.script.url){google.script.url.getLocation(loc=>{const k=loc&&loc.parameter&&loc.parameter.s;if(k)subStart(k);else mainStart();});return;}}catch(e){}
  mainStart();
};
</script>
