<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Postal Agent</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b2a55"><link rel="apple-touch-icon" href="icon-192.png"><script id="ghCfg">window.GHCFG={key:"pam",title:"Postal Agent",theme:"#0b2a55",fix:function(h){return h.replace(/sessionStorage/g,'localStorage');}};</script>
<script id="ghShim">/* GitHub Pages version: talks to the Apps Script web app with fetch, keeps working offline.
   Data entered offline waits on this phone and goes to the Sheet by itself when the net is back. */
(function(){
var LS=window.localStorage;
function lget(k,d){try{var v=LS.getItem(k);return v==null?d:v;}catch(e){return d;}}
function lset(k,v){try{if(v==null)LS.removeItem(k);else LS.setItem(k,v);}catch(e){}}
function qs(){var o={};location.search.replace(/^\?/,'').split('&').forEach(function(kv){if(!kv)return;var i=kv.indexOf('=');
  try{o[decodeURIComponent(i<0?kv:kv.slice(0,i))]=decodeURIComponent((i<0?'':kv.slice(i+1)).replace(/\+/g,' '));}catch(e){}});return o;}
var P=qs();
var STANDALONE=false;try{STANDALONE=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){}
if(P.a)lset('pam_api',P.a);
/* sub-agent link: remember it, so the home-screen icon opens his page again */
if(P.s)lset('pam_s',P.s);else if(!STANDALONE)lset('pam_s',null);
if(!P.s&&STANDALONE&&lget('pam_s',''))P.s=lget('pam_s','');
function apiId(){return lget('pam_api','');}
function apiUrl(){var id=apiId();return id?'https:'+'\/\/script.google.com/macros/s/'+id+'/exec':'';}

/* ---------- small store (IndexedDB) for the last data seen ---------- */
var dbp=null;
function db(){if(!dbp)dbp=new Promise(function(res,rej){var r=indexedDB.open('pam',1);r.onupgradeneeded=function(){r.result.createObjectStore('c');};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return dbp;}
function cget(k){return db().then(function(d){return new Promise(function(res){var t=d.transaction('c').objectStore('c').get(k);
  t.onsuccess=function(){res(t.result);};t.onerror=function(){res(undefined);};});}).catch(function(){return undefined;});}
function cput(k,v){return db().then(function(d){return new Promise(function(res){var tx=d.transaction('c','readwrite');tx.objectStore('c').put(v,k);
  tx.oncomplete=res;tx.onerror=res;tx.onabort=res;});}).catch(function(){});}

/* ---------- waiting list (entries made offline) ---------- */
function getQ(){try{return JSON.parse(lget('pam_q','[]'))||[];}catch(e){return [];}}
function setQ(q){lset('pam_q',JSON.stringify(q));banner();}
function addQ(fn,args){var q=getQ();var it={id:Date.now()+''+Math.floor(Math.random()*1000),fn:fn,args:args};q.push(it);setQ(q);return it;}
function delQ(id){setQ(getQ().filter(function(x){return x.id!==id;}));}

var READS=['bootstrap','getCollections','unlotted','lotDetail','commission','subSummary'];
function ckey(fn,a){
  if(fn==='api')return READS.indexOf(a[1])>=0?'api:'+a[1]+':'+JSON.stringify(a[2]||{}):'';
  if(fn==='subBoot')return 'subBoot:'+a[0]+':'+(a[1]||'');
  if(fn==='subComm'||fn==='subBook')return fn+':'+a[0]+':'+JSON.stringify(a[1]||{});
  if(fn==='publicInfo')return 'publicInfo';
  return '';
}
function queueable(fn,a){
  if(fn==='api')return a[1]==='saveCollection';
  return ['subMark','subMarkMany','subPay','subSetPhone','subUnmark'].indexOf(fn)>=0;
}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function modeKey(m){m=String(m||'').toLowerCase();if(m.indexOf('credit')>=0||m==='dhar')return 'Credit';
  if(m.indexOf('online')>=0||m.indexOf('upi')>=0||m.indexOf('cheque')>=0)return 'Online';return 'Cash';}

/* put the waiting entries on top of the last data from the server */
function patchBoot(d){
  if(!d||!d.accounts)return d;
  var t=today();
  getQ().forEach(function(it){
    if(it.fn!=='api'||it.args[1]!=='saveCollection')return;
    var p=it.args[2]||{},a=null;for(var i=0;i<d.accounts.length;i++)if(d.accounts[i].AccNo===p.AccNo){a=d.accounts[i];break;}
    if(!a)return;
    var n=parseInt(p.Months,10)||0,amt=(+a.Amount||0)*n,tot=amt+(+p.DefaultFee||0)-(+p.Rebate||0),dt=p.Date||t;
    a.Paid=(+a.Paid||0)+n;if(!a.LastPay||dt>a.LastPay)a.LastPay=dt;
    var rec={AccNo:a.AccNo,Date:dt,Months:String(n),Total:String(tot),SubAgent:a.SubAgent||''};
    if(d.cur&&dt.slice(0,7)===t.slice(0,7))d.cur.push(rec);
    if(d.unl)d.unl.push(Object.assign({},rec,{ColID:'OFF'+it.id,Amount:String(amt),Mode:modeKey(p.Mode)}));
    if(d.ledger&&modeKey(p.Mode)==='Credit'){var cn='';(d.customers||[]).forEach(function(c){if(c.CustID===a.CustID)cn=c.Name;});
      d.ledger.push({TxID:'OFF'+it.id,Date:dt,Type:'GIVE',PartyType:'CUST',PartyID:a.CustID,PartyName:cn,AccNo:a.AccNo,Amount:String(tot),Note:'কিস্তি ধারে — '+n+' কিস্তি (অফলাইন)',LotNo:'',ColID:'OFF'+it.id});}
    if(d.stats){if(dt===t)d.stats.todayAmt=(+d.stats.todayAmt||0)+tot;if(dt.slice(0,7)===t.slice(0,7))d.stats.monthAmt=(+d.stats.monthAmt||0)+tot;
      d.stats.unlottedCnt=(+d.stats.unlottedCnt||0)+1;d.stats.unlottedAmt=(+d.stats.unlottedAmt||0)+tot;}
  });
  return d;
}
function patchSub(d,key){
  if(!d||!d.accounts)return d;
  var find=function(acc){for(var i=0;i<d.accounts.length;i++)if(d.accounts[i].acc===acc)return d.accounts[i];return null;};
  getQ().forEach(function(it){
    if(it.args[0]!==key)return;var p=it.args[1]||{};
    if((it.fn==='subMark'||it.fn==='subMarkMany')&&p.month===d.month){
      var items=it.fn==='subMark'?[{acc:p.acc,n:p.n,mode:p.mode}]:(p.items||[]);
      items.forEach(function(o,j){var x=find(o.acc);if(!x)return;var n=+o.n||0;
        x.entries.push({id:'tmp'+it.id+'_'+j,n:n,total:x.amt*n,mode:o.mode||'Cash',lot:'',mine:true,tmp:true});x.paid+=n;x.due=Math.max(0,x.due-n);});
    }else if(it.fn==='subPay'&&p.month===d.month){
      var tot=0;d.accounts.forEach(function(x){x.entries.forEach(function(e){if(e.mine)tot+=e.total;});});
      var on=+p.online||0,cr=+p.credit||0;d.pay={Total:tot,Online:on,Credit:cr,Cash:tot-on-cr,Note:p.note||'',Updated:'অফলাইনে — নেট এলে যাবে',LedgerTx:''};
    }else if(it.fn==='subSetPhone'){var x=find(p.acc);if(x)x.phone=p.phone;}
    else if(it.fn==='subUnmark'&&p.month===d.month){d.accounts.forEach(function(x){var e=null;x.entries.forEach(function(z){if(z.id===p.id)e=z;});
      if(e){x.entries=x.entries.filter(function(z){return z.id!==p.id;});x.paid-=e.n;x.due+=e.n;}});}
  });
  return d;
}
function patch(fn,a,r){
  if(fn==='api'&&a[1]==='bootstrap')return patchBoot(r);
  if(fn==='subBoot')return patchSub(r,a[0]);
  return r;
}
/* keep a copy of whatever fresh data the server sends back */
function keep(fn,a,r){
  var k=ckey(fn,a);if(k)cput(k,r);
  if(fn==='api'&&r){var b=r.accounts&&r.settings?r:(r.boot&&r.boot.accounts?r.boot:null);if(b)cput('api:bootstrap:{}',b);}
  if(fn.indexOf('sub')===0&&r&&r.sub&&r.accounts){cput('subBoot:'+a[0]+':'+r.month,r);if(fn==='subBoot'&&!a[1])cput('subBoot:'+a[0]+':',r);}
}

/* ---------- network ---------- */
function netErr(){var e=new Error('📴 নেট নেই');e.net=true;return e;}
function post(fn,args){
  var u=apiUrl();if(!u)return Promise.reject(new Error('অ্যাপের সংযোগ বসানো নেই'));
  if(navigator.onLine===false)return Promise.reject(netErr());
  return fetch(u,{method:'POST',body:JSON.stringify({fn:fn,args:args}),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow'})
    .catch(function(){throw netErr();})
    .then(function(res){return res.text();})
    .then(function(tx){var j;try{j=JSON.parse(tx);}catch(e){throw new Error('Apps Script থেকে ঠিক উত্তর আসছে না — Deploy-এ "Who has access: Anyone" আছে কিনা দেখুন');}
      if(!j.ok)throw new Error(j.e||'Error');ONLINE(true);return j.r;});
}
var MEMPW=null,NEEDLOGIN=false;
function hash(s){try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode('pam|'+s)).then(function(b){
  return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}catch(e){return Promise.resolve('');}}
function getTok(){try{if(typeof TOK!=='undefined'&&TOK)return TOK;}catch(e){}return lget('tok','');}
function setTok(t){lset('tok',t);try{TOK=t;}catch(e){}}
function relogin(){if(!MEMPW)return Promise.reject(new Error('SESSION_EXPIRED'));
  return post('login',[MEMPW]).then(function(t){setTok(t);NEEDLOGIN=false;return t;});}

function loginFn(pw){
  return post('login',[pw]).then(function(t){MEMPW=null;NEEDLOGIN=false;hash(pw).then(function(h){if(h)lset('pam_pwh',h);});setTimeout(sync,2000);return t;},
    function(e){
      if(!e.net)throw e;
      return Promise.all([hash(pw),cget('api:bootstrap:{}')]).then(function(x){
        if(!x[1])throw new Error('📴 নেট নেই — এই ফোনে আগে একবার নেট থাকতে লগইন করুন, তারপর অফলাইনেও খুলবে');
        if(!x[0]||x[0]!==lget('pam_pwh',''))throw new Error('Wrong password');
        MEMPW=pw;return 'OFFLINE';});
    });
}
function offline(fn,a,k,wr){
  if(wr){
    var it;
    if(fn==='subUnmark'&&String((a[1]||{}).id||'').indexOf('tmp')===0){
      /* a tick made offline and undone offline: just drop it from the waiting list */
      var q=getQ(),acc=null;
      return cget('subBoot:'+a[0]+':'+(a[1]||{}).month).then(function(){
        for(var i=q.length-1;i>=0;i--){var x=q[i];if(x.args[0]!==a[0])continue;
          if(x.fn==='subMark'){q.splice(i,1);break;}
          if(x.fn==='subMarkMany'&&x.args[1].items&&x.args[1].items.length){x.args[1].items.pop();if(!x.args[1].items.length)q.splice(i,1);break;}}
        setQ(q);return {__offline:1};});
    }
    it=addQ(fn,a);
    if(fn==='api'&&a[1]==='saveCollection'){
      return cget('api:bootstrap:{}').then(function(b){
        if(!b){delQ(it.id);throw new Error('📴 নেট নেই — আগে একবার নেট থাকতে অ্যাপ খুলুন');}
        b=patchBoot(b);b.__cached=1;var p=a[2]||{},ac=null,cu={};
        b.accounts.forEach(function(x){if(x.AccNo===p.AccNo)ac=x;});(b.customers||[]).forEach(function(c){if(ac&&c.CustID===ac.CustID)cu=c;});
        var n=parseInt(p.Months,10)||0,amt=(+(ac||{}).Amount||0)*n,fee=+p.DefaultFee||0,reb=+p.Rebate||0;
        var col={ColID:'OFF'+it.id,Date:p.Date||today(),AccNo:p.AccNo,CustID:ac?ac.CustID:'',Name:cu.Name||'',Scheme:'RD',Months:n,
          FromInst:ac?ac.Paid-n+1:'',ToInst:ac?ac.Paid:'',Amount:amt,DefaultFee:fee,Rebate:reb,Total:amt+fee-reb,LotNo:'',Mode:p.Mode||'Cash',Remarks:p.Remarks||'',SubAgent:ac?ac.SubAgent||'':''};
        tip('📴 অফলাইনে রাখা হলো — নেট এলে Sheet-এ উঠবে');
        return {col:col,boot:b};});
    }
    tip('📴 অফলাইনে রাখা হলো — নেট এলে এজেন্টের কাছে যাবে');
    return Promise.resolve({__offline:1});
  }
  if(k)return cget(k).then(function(r){
    if(r===undefined)throw new Error('📴 নেট নেই — নেট এলে আবার চেষ্টা করুন');
    r=patch(fn,a,r);if(r&&typeof r==='object')r.__cached=1;return r;});
  return Promise.reject(new Error('📴 নেট নেই — এই কাজটা নেট এলে করুন'));
}
function send(fn,a){
  if(!apiId()){setupBox();return Promise.reject(new Error('অ্যাপের সংযোগ বসানো নেই'));}
  if(fn==='login')return loginFn(a[0]);
  var k=ckey(fn,a),wr=queueable(fn,a);
  /* entries wait in order: while older ones are waiting, new ones join the line */
  if(wr&&getQ().length){var r0=offline(fn,a,k,wr);setTimeout(sync,300);return r0;}
  var go=function(){return post(fn,a);};
  if(fn==='api'&&a[0]==='OFFLINE'&&navigator.onLine!==false)go=function(){return relogin().then(function(t){a=a.slice();a[0]=t;return post(fn,a);});};
  return go().then(function(r){keep(fn,a,r);return patch(fn,a,r);},function(e){
    if(e.net){ONLINE(false);return offline(fn,a,k,wr);}
    if(fn==='api'&&String(e.message).indexOf('SESSION_EXPIRED')>=0&&MEMPW)
      return relogin().then(function(t){a=a.slice();a[0]=t;return post(fn,a).then(function(r){keep(fn,a,r);return patch(fn,a,r);});});
    throw e;});
}

/* ---------- send the waiting entries ---------- */
var SYNCING=false,SENT=0;
function sync(){
  if(SYNCING||navigator.onLine===false||!getQ().length){banner();return;}
  SYNCING=true;banner();
  var run=function(){return new Promise(function(fin){
    var stop=function(){SYNCING=false;banner();fin();};
    (function next(){
      var q=getQ();
      if(!q.length){stop();done();return;}
      var it=q[0],a=it.args.slice();
      var step=Promise.resolve();
      if(it.fn==='api'){var t=getTok();
        if(!t||t==='OFFLINE')step=MEMPW?relogin():Promise.reject(new Error('SESSION_EXPIRED'));
        step=step.then(function(){a[0]=getTok();});}
      step.then(function(){return post(it.fn,a);}).then(function(r){keep(it.fn,a,r);delQ(it.id);SENT++;next();},function(e){
        if(e.net){ONLINE(false);stop();return;}
        if(String(e.message).indexOf('SESSION_EXPIRED')>=0){NEEDLOGIN=true;stop();return;}
        delQ(it.id);tip('⚠ অফলাইনের একটা এন্ট্রি ওঠেনি ('+(it.args[2]&&it.args[2].AccNo||it.args[1]&&it.args[1].acc||'')+'): '+e.message,8000);next();});
    })();});};
  /* only one open tab sends at a time */
  if(navigator.locks&&navigator.locks.request)navigator.locks.request('pam_sync',{ifAvailable:true},function(l){if(!l){SYNCING=false;banner();return;}return run();});
  else run();
}
/* another tab sent the waiting entries: show the fresh data here too */
window.addEventListener('storage',function(e){if(e.key!=='pam_q')return;banner();
  try{var o=JSON.parse(e.oldValue||'[]'),n=JSON.parse(e.newValue||'[]');if(o.length&&!n.length){SENT=SENT||o.length;done();}}catch(x){}});
function done(){
  if(!SENT)return;var n=SENT;SENT=0;tip('✔ অফলাইনের '+n+'টা এন্ট্রি Sheet-এ উঠে গেছে',5000);
  try{if(typeof SK!=='undefined'&&SK&&typeof subLoad==='function'){if(!SPEND)subLoad();return;}}catch(e){}
  try{if(typeof TOK!=='undefined'&&TOK&&TOK!=='OFFLINE'&&!document.getElementById('app').classList.contains('hide')&&document.getElementById('modal').classList.contains('hide'))boot();}catch(e){}
}
var ISON=navigator.onLine!==false;
function ONLINE(v){if(ISON!==v){ISON=v;banner();if(v)setTimeout(sync,500);}}
window.addEventListener('online',function(){ONLINE(true);sync();});
window.addEventListener('offline',function(){ONLINE(false);});
setInterval(function(){if(getQ().length)sync();},20000);

/* ---------- little status pill ---------- */
function banner(){
  var b=document.getElementById('ghNet');if(!b){if(!document.body)return;b=document.createElement('div');b.id='ghNet';
    b.style.cssText='position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:99999;padding:5px 12px;border-radius:20px;font:600 13px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:94vw;text-align:center;cursor:pointer';
    b.onclick=function(){sync();};document.body.appendChild(b);}
  var n=getQ().length,off=!ISON||navigator.onLine===false,t='',bg='';
  if(off){t='📴 অফলাইন'+(n?' — '+n+'টা এন্ট্রি ফোনে জমা আছে':'');bg='#fde68a';}
  else if(n&&NEEDLOGIN){t='🔑 নেট এসেছে — একবার লগইন করুন, '+n+'টা জমা এন্ট্রি উঠে যাবে';bg='#fecaca';}
  else if(n){t='⏳ '+n+'টা এন্ট্রি Sheet-এ পাঠানো হচ্ছে…';bg='#bfdbfe';}
  b.textContent=t;b.style.background=bg;b.style.color='#111';b.style.display=t?'block':'none';
}
function tip(m,ms){try{if(typeof toast==='function'){toast(m);return;}}catch(e){}}

/* ---------- first time on a device: ask for the Apps Script link ---------- */
function setupBox(){
  if(document.getElementById('ghSetup')||!document.body)return;
  var d=document.createElement('div');d.id='ghSetup';
  d.style.cssText='position:fixed;inset:0;z-index:100000;background:#0b2a55;color:#fff;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif';
  d.innerHTML='<div style="background:#fff;color:#0f1b2d;border-radius:14px;padding:18px;max-width:460px;width:100%">'+
    '<h2 style="margin:0 0 8px">📮 প্রথমবার সংযোগ</h2><p style="margin:0 0 10px;color:#475569">Apps Script-এর Web app লিংকটা (…/exec) এখানে paste করুন। একবার দিলেই এই ফোনে মনে থাকবে।</p>'+
    '<input id="ghU" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px" placeholder="https:'+'\/\/script.google.com/macros/s/…/exec">'+
    '<p id="ghE" style="color:#b91c1c;margin:6px 0 0"></p><button id="ghB" style="margin-top:10px;width:100%;padding:11px;border:0;border-radius:8px;background:#15803d;color:#fff;font-size:16px;font-weight:700">✔ সংযোগ করুন</button></div>';
  document.body.appendChild(d);

    if(!m){document.getElementById('ghE').textContent='লিংকটা ঠিক নয় — …/macros/s/…/exec লিংকটা দিন';return;}
    lset('pam_api',m[1]);location.reload();};
}

/* ---------- google.script.* for this page ---------- */
function runner(){
  var o={_s:null,_f:null},px;
  o.withSuccessHandler=function(f){o._s=f;return px;};o.withFailureHandler=function(f){o._f=f;return px;};o.withUserObject=function(){return px;};
  px=new Proxy(o,{get:function(t,k){if(k in t)return t[k];if(typeof k!=='string'||k==='then')return undefined;return function(){var a=[].slice.call(arguments);
    send(k,a).then(function(r){if(t._s)t._s(r);},function(e){if(t._f)t._f(e);});};}});
  return px;
}
var HCH=null;
window.google={script:{
  get run(){return runner();},
  history:{push:function(st){try{history.pushState(st||{},'',location.pathname+location.search);}catch(e){}},
    replace:function(st){try{history.replaceState(st||{},'',location.pathname+location.search);}catch(e){}},
    setChangeHandler:function(f){HCH=f;}},
  url:{getLocation:function(cb){setTimeout(function(){cb({parameter:P,parameters:{},hash:location.hash.replace(/^#/,'')});},0);}}
}};
window.addEventListener('popstate',function(e){if(HCH)HCH({state:e.state,location:{parameter:P}});});
window.__GH={appUrl:function(){return apiId()?location.origin+location.pathname+'?a='+apiId():'';},sync:sync,queue:getQ,post:post,cget:cget,cput:cput,apiId:apiId,setupBox:setupBox};
document.addEventListener('DOMContentLoaded',function(){banner();if(!apiId())setupBox();else setTimeout(sync,1500);});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();
</script>
<script id="ghLoad">/* opens the app page kept on this phone (fast, works without net); a newer page is fetched in the background */
(function(){
var G=window.__GH,CFG=window.GHCFG||{};
if(window.__GHRENDERED){
  window.addEventListener('load',function(){setTimeout(function(){
    if(navigator.onLine===false||!G||!G.apiId())return;
    G.post('__page',[]).then(function(h){return G.cget('__page').then(function(old){if(h&&h.indexOf('<')>=0&&h!==old)return G.cput('__page',h).then(upd);});},function(){});},4000);});
  var upd=function(){var b=document.createElement('div');b.textContent='🔄 অ্যাপের নতুন আপডেট এসেছে — এখানে চাপুন';
    b.style.cssText='position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:99999;background:#15803d;color:#fff;padding:9px 16px;border-radius:22px;font:600 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3);max-width:92vw;text-align:center';
    b.onclick=function(){location.reload();};document.body.appendChild(b);};
  return;
}
function el(id){return document.getElementById(id);}
function msg(t){var m=el('ghMsg');if(m)m.innerHTML=t;}
function tags(){var s='<script>window.__GHRENDERED=1;<\/script>';['ghCfg','ghShim','ghLoad'].forEach(function(id){var e=el(id);if(e)s+='<script id="'+id+'">'+e.textContent+'<\/script>';});return s;}
function render(h){
  if(CFG.fix)h=CFG.fix(h);
  var head='<link rel="manifest" href="manifest.json"><meta name="theme-color" content="'+(CFG.theme||'#0b2a55')+'"><link rel="apple-touch-icon" href="icon-192.png">';
  if(!/name=["']?viewport/i.test(h))head+='<meta name="viewport" content="width=device-width, initial-scale=1">';
  if(!/<title>/i.test(h))head+='<title>'+(CFG.title||'App')+'</title>';
  head+=tags();
  var i=h.search(/<head[^>]*>/i);
  if(i>=0){var j=h.indexOf('>',i)+1;h=h.slice(0,j)+head+h.slice(j);}else h=head+h;
  window.__GHRENDERED=1;document.open();document.write(h);document.close();
}
function start(){
  if(!G.apiId()){G.setupBox();return;}
  G.cget('__page').then(function(old){
    if(old){render(old);return;}
    msg('⏳ প্রথমবার অ্যাপ আনা হচ্ছে…');
    G.post('__page',[]).then(function(h){if(!h||h.indexOf('<')<0)throw new Error('পাতা পাওয়া গেল না');return G.cput('__page',h).then(function(){render(h);});},
      function(e){msg('⚠ '+((e&&e.message)||e)+(e&&e.net?'<br>প্রথমবার খোলার সময় নেট লাগবে।':'')+'<br><br><button style="padding:10px 18px;font-size:16px" onclick="location.reload()">আবার চেষ্টা</button>');});
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
